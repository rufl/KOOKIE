name: Verify KOOKIE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this verification run is being started"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOF_VERSION: 0.5.0-beta
  KOF_SOURCE_COMMIT: bf17ac7e736471c8a04b4153e5b0f607be75e70c

jobs:
  verify:
    name: LSP, linter, compiler, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout pinned Kof source
        uses: actions/checkout@v5
        with:
          repository: KofLang/Kof4j
          ref: ${{ env.KOF_SOURCE_COMMIT }}
          path: _kof
          persist-credentials: false
      - name: Install Java runtime for Kof build and JVM artifacts
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"


      - name: Build pinned Kof toolchain
        run: |
          set -euo pipefail
          mvn -q -f _kof/pom.xml package -DskipTests
          bash _kof/scripts/package.sh \
            --output "$RUNNER_TEMP/kof-dist" --skip-build
          archive="$RUNNER_TEMP/kof-dist/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          echo "KOOKIE_KOF_ARCHIVE_SHA256=$archive_sha256" >> "$GITHUB_ENV"
          echo "KOOKIE_KOF_SOURCE_COMMIT=$KOF_SOURCE_COMMIT" >> "$GITHUB_ENV"
          kof_bin="$RUNNER_TEMP/kof-dist/kof-${KOF_VERSION}-linux-x86_64/bin"
          echo "$kof_bin" >> "$GITHUB_PATH"
          export PATH="$kof_bin:$PATH"
          kof version
          rm -rf _kof

      - name: Run repository verification gate
        run: bash scripts/verify.sh
