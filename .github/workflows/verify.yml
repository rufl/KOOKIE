name: Verify KOOKIE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this verification run is being started"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOF_VERSION: 0.6.5
  KOF_SOURCE_COMMIT: a14a7cd47d74192dcc977c9d4cbf87d407694560
  WINDOWS_JAVA_ARCHIVE_URL: https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27%2B35/OpenJDK27U-jre_x64_windows_hotspot_27_35.zip
  WINDOWS_JAVA_ARCHIVE_SHA256: e9cf542d5ffe2a894637b18c27a7802853976deaa3abe3e04dfbb8a307a145dd
  # Hosted runners are shared; keep the recorded 4 ms local target separate
  # from this scheduling-tolerant CI ceiling.
  KOOKIE_SERVER_P95_BUDGET_US: "8000"
  ZIG_VERSION: 0.17.0
  ZIG_ARCHIVE_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
  ZIG_ARCHIVE_URL: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz

jobs:
  toolchain:
    name: Build pinned Kof archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout KOOKIE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate repository Kof pin
        shell: bash
        run: |
          set -euo pipefail
          source scripts/kof_pin.sh
          [[ "$KOF_VERSION" == "$KOF_PIN_VERSION" ]]
          [[ "$KOF_SOURCE_COMMIT" == "$KOF_PIN_SOURCE_COMMIT" ]]
      - name: Cache pinned Kof archive
        id: kof-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kookie/kof
          key: kookie-kof-linux-${{ env.KOF_VERSION }}-${{ env.KOF_SOURCE_COMMIT }}
      - name: Checkout pinned Kof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KofLang/Kof4j
          ref: ${{ env.KOF_SOURCE_COMMIT }}
          path: _kof
          persist-credentials: false
      - name: Install Java runtime for Kof build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
          cache-dependency-path: _kof/pom.xml
      - name: Build pinned Kof distribution
        if: steps.kof-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_kof_source.sh _kof "$KOF_VERSION"
          mvn -q -f _kof/pom.xml flatten:flatten \
            -Drevision="$KOF_VERSION"
          for pom_dir in _kof _kof/kof-compiler _kof/kof-cli \
              _kof/kof-runtime _kof/kof-script _kof/kof-c-compiler; do
            cp -- "$pom_dir/.flattened-pom.xml" "$pom_dir/pom.xml"
          done
          mvn -q -f _kof/pom.xml clean package \
            -DskipTests -Drevision="$KOF_VERSION" \
            -DcreateDependencyReducedPom=false
          artifact_dir="$HOME/.cache/kookie/kof"
          rm -rf -- "$artifact_dir"
          mkdir -p "$artifact_dir"
          bash _kof/scripts/package.sh \
            --output "$artifact_dir" --skip-build
          archive="$artifact_dir/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          test -f "$archive"
          (
            cd "$artifact_dir"
            sha256sum "$(basename "$archive")" > SHA256SUMS
            printf '%s\n' "$KOF_SOURCE_COMMIT" > SOURCE_COMMIT
          )
          rm -rf -- _kof
      - name: Validate pinned Kof archive
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$HOME/.cache/kookie/kof"
          archive="$artifact_dir/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          test -f "$archive"
          (cd "$artifact_dir" && sha256sum --check SHA256SUMS)
          [[ "$(tr -d '\r\n' < "$artifact_dir/SOURCE_COMMIT")" == "$KOF_SOURCE_COMMIT" ]]
          upload_dir="$RUNNER_TEMP/kookie-kof-artifact"
          rm -rf -- "$upload_dir"
          mkdir -p "$upload_dir"
          cp "$artifact_dir"/kof-*.tar.gz "$artifact_dir"/SHA256SUMS \
            "$artifact_dir"/SOURCE_COMMIT "$upload_dir"/
      - name: Upload pinned Kof archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-kof-${{ github.run_id }}
          path: ${{ runner.temp }}/kookie-kof-artifact
          if-no-files-found: error
          retention-days: 2

  static:
    name: Static and JVM verification
    needs: [toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Java runtime
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "27"
      - name: Download pinned Kof archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-kof-${{ github.run_id }}
          path: ${{ runner.temp }}/kookie-kof
      - name: Configure pinned Kof archive
        run: |
          bash scripts/configure_kof_archive.sh \
            "$RUNNER_TEMP/kookie-kof/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
      - name: Preflight static runner
        run: bash scripts/runner_preflight.sh static
      - name: Run static and JVM verification
        run: bash scripts/ci_timed.sh static-jvm bash scripts/verify_static.sh
      - name: Build canonical JVM artifact
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/kookie-jvm-artifact"
          mkdir -p "$artifact_dir/jvm"
          kof build src --target jvm --output "$artifact_dir/jvm" >/dev/null
          bash scripts/write_build_identity.sh jvm \
            "$artifact_dir/jvm" "$artifact_dir/jvm.identity"
      - name: Upload canonical JVM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-jvm-${{ github.run_id }}
          path: ${{ runner.temp }}/kookie-jvm-artifact
          if-no-files-found: error
          retention-days: 2
      - name: Check repository scripts
        run: |
          bash -n scripts/build_demo_release.sh \
            scripts/bootstrap_sdl3_mixer.sh \
            scripts/check_release_readiness.sh \
            scripts/bootstrap_release.sh \
            scripts/sdl3_dependencies.sh \
            scripts/verify_linux_presentation_package.sh \
            scripts/verify_windows_presentation.sh \
            scripts/package_kookie.sh \
            scripts/configure_kof_archive.sh \
            scripts/prepare_kof_source.sh \
            scripts/kof_pe_build.sh \
            scripts/verify_kof_pe_backend.sh \
            scripts/verify_package.sh \
            scripts/verify_static.sh \
            scripts/verify_ui_library.sh \
            scripts/verify_ui_sound_catalog.sh \
            scripts/verify_font_ui.sh \
            scripts/runner_preflight.sh \
            scripts/ci_timed.sh \
            scripts/kof_observed.sh \
            scripts/write_build_identity.sh

  verify:
    name: LSP, linter, compiler, and build
    needs: [toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      KOOKIE_KOF_BUILD_HISTORY_DIR: ${{ github.workspace }}/.cache/kookie/build-history
      KOOKIE_KOF_BUILD_TIMEOUT_SECONDS: "2700"
      KOOKIE_KOF_BUILD_HEARTBEAT_SECONDS: "30"
      KOOKIE_KOF_BUILD_KILL_AFTER_SECONDS: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Java runtime
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "27"
      - name: Download pinned Kof archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-kof-${{ github.run_id }}
          path: ${{ runner.temp }}/kookie-kof
      - name: Configure pinned Kof archive
        run: |
          bash scripts/configure_kof_archive.sh \
            "$RUNNER_TEMP/kookie-kof/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
      - name: Cache canonical source builds
        id: canonical-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/kookie/canonical-native
            .cache/kookie/build-history
          key: kookie-canonical-native-${{ github.sha }}-${{ env.KOF_SOURCE_COMMIT }}
      - name: Cache pinned Zig archive
        id: zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kookie/toolchains/zig
          key: kookie-zig-linux-${{ env.ZIG_VERSION }}-${{ env.ZIG_ARCHIVE_SHA256 }}
      - name: Install pinned Zig cross-toolchain
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/kookie/toolchains/zig"
          mkdir -p "$cache_dir"
          archive="$cache_dir/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          install_dir="$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
              --output "$archive" "$ZIG_ARCHIVE_URL"
          fi
          echo "$ZIG_ARCHIVE_SHA256  $archive" | sha256sum --check -
          rm -rf -- "$install_dir"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          printf 'KOOKIE_ZIG_VERSION=%s\n' "$ZIG_VERSION" >> "$GITHUB_ENV"
          printf 'KOOKIE_ZIG_ARCHIVE_SHA256=%s\n' \
            "$ZIG_ARCHIVE_SHA256" >> "$GITHUB_ENV"
          "$install_dir/zig" version
      - name: Record Zig cache result
        run: |
          printf '%s\n' '- Zig archive cache hit: `${{ steps.zig-cache.outputs.cache-hit || false }}`' >> "$GITHUB_STEP_SUMMARY"
      - name: Install Clang, Wine, and native text dependencies
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install \
            --no-install-recommends -y clang wine wine64 wine32:i386 \
            libfreetype-dev libharfbuzz-dev
          clang --version
          wine --version
          smoke_prefix="$RUNNER_TEMP/wine-ci-smoke"
          WINEARCH=win64 WINEPREFIX="$smoke_prefix" WINEDEBUG=-all \
            wineboot --init
          rm -rf -- "$smoke_prefix"
      - name: Preflight native runner
        run: bash scripts/runner_preflight.sh native
      - name: Run native and package verification
        env:
          KOOKIE_BUILD_LOG_DIR: ${{ runner.temp }}/kookie-build-logs
        run: |
          bash scripts/ci_timed.sh native-package env \
            KOOKIE_CANONICAL_BUILD_CACHE_DIR="$GITHUB_WORKSPACE/.cache/kookie/canonical-native" \
            KOOKIE_VERIFY_SKIP_STATIC=1 bash scripts/verify.sh
      - name: Upload Kof build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-kof-build-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kookie-build-logs
            .cache/kookie/build-history
          if-no-files-found: warn
          retention-days: 7
      - name: Record canonical build cache result
        run: |
          printf '%s\n' \
            '- Canonical source build cache hit: `${{ steps.canonical-cache.outputs.cache-hit || false }}`' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Verify G6 runtime probes
        run: bash scripts/ci_timed.sh g6-runtime bash scripts/verify_g6_runtime.sh
      - name: Verify Kof PE backend
        run: bash scripts/ci_timed.sh kof-pe bash scripts/verify_kof_pe_backend.sh

  windows-jvm:
    name: Windows JVM package
    needs: [toolchain, static]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Java runtime
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "27"
      - name: Download pinned Kof archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-kof-${{ github.run_id }}
          path: ${{ runner.temp }}/kookie-kof
      - name: Download canonical JVM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-jvm-${{ github.run_id }}
          path: ${{ runner.temp }}/kookie-jvm
      - name: Configure pinned Kof archive
        run: |
          bash scripts/configure_kof_archive.sh \
            "$RUNNER_TEMP/kookie-kof/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
      - name: Configure canonical JVM artifact
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/kookie-jvm/jvm.identity"
          test -f "$RUNNER_TEMP/kookie-jvm/jvm/Default/Main.class"
          printf 'KOOKIE_PREBUILT_JVM_BUILD=%s\n' \
            "$RUNNER_TEMP/kookie-jvm/jvm" >> "$GITHUB_ENV"
          printf 'KOOKIE_PREBUILT_JVM_MANIFEST=%s\n' \
            "$RUNNER_TEMP/kookie-jvm/jvm.identity" >> "$GITHUB_ENV"
      - name: Cache pinned Zig archive
        id: windows-jvm-zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kookie/toolchains/zig
          key: kookie-zig-linux-${{ env.ZIG_VERSION }}-${{ env.ZIG_ARCHIVE_SHA256 }}
      - name: Install pinned Zig cross-toolchain
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/kookie/toolchains/zig"
          mkdir -p "$cache_dir"
          archive="$cache_dir/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          install_dir="$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
              --output "$archive" "$ZIG_ARCHIVE_URL"
          fi
          echo "$ZIG_ARCHIVE_SHA256  $archive" | sha256sum --check -
          rm -rf -- "$install_dir"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          test -x "$install_dir/zig"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          printf 'KOOKIE_ZIG_VERSION=%s\n' "$ZIG_VERSION" >> "$GITHUB_ENV"
          printf 'KOOKIE_ZIG_ARCHIVE_SHA256=%s\n' \
            "$ZIG_ARCHIVE_SHA256" >> "$GITHUB_ENV"
          "$install_dir/zig" version
      - name: Record Windows JVM Zig cache result
        run: |
          printf '%s\n' '- Windows JVM Zig archive cache hit: `${{ steps.windows-jvm-zig-cache.outputs.cache-hit || false }}`' >> "$GITHUB_STEP_SUMMARY"
      - name: Cache pinned Windows JVM runtime
        id: windows-jvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kookie/toolchains/windows-jvm
          key: kookie-windows-jvm-${{ env.WINDOWS_JAVA_ARCHIVE_SHA256 }}
      - name: Download pinned Windows JVM runtime
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/kookie/toolchains/windows-jvm"
          mkdir -p "$cache_dir"
          archive="$cache_dir/OpenJDK27U-jre_x64_windows_hotspot_27_35.zip"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
              --output "$archive" "$WINDOWS_JAVA_ARCHIVE_URL"
          fi
          echo "$WINDOWS_JAVA_ARCHIVE_SHA256  $archive" | sha256sum --check -
          printf 'KOOKIE_WINDOWS_JAVA_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'KOOKIE_WINDOWS_JAVA_ARCHIVE_SHA256=%s\n' \
            "$WINDOWS_JAVA_ARCHIVE_SHA256" >> "$GITHUB_ENV"
      - name: Record Windows JVM cache result
        run: |
          printf '%s\n' '- Windows JVM archive cache hit: `${{ steps.windows-jvm-cache.outputs.cache-hit || false }}`' >> "$GITHUB_STEP_SUMMARY"
      - name: Preflight Windows JVM runner
        run: bash scripts/runner_preflight.sh static
      - name: Verify reproducible Windows JVM package
        run: bash scripts/ci_timed.sh windows-jvm bash scripts/verify_windows_jvm_package.sh
