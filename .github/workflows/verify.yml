name: Verify KOOKIE

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOF_VERSION: 0.4.10-beta
  KOF_ARCHIVE_SHA256: 9dd917bd18f35a6c396a3bd45d28b83bd97afeb179f302dda4f475979cb13698

jobs:
  verify:
    name: LSP, linter, compiler, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pinned Kof toolchain
        run: |
          set -euo pipefail
          archive="kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          url="https://github.com/KofLang/Kof4j/releases/download/kof-${KOF_VERSION}-linux-x86_64/${archive}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "$url"
          echo "${KOF_ARCHIVE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          kof_bin="$RUNNER_TEMP/kof-${KOF_VERSION}-linux-x86_64/bin"
          echo "$kof_bin" >> "$GITHUB_PATH"
          export PATH="$kof_bin:$PATH"
          kof version

      - name: Run repository verification gate
        run: bash scripts/verify.sh
