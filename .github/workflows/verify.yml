name: Verify KOOKIE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this verification run is being started"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOF_VERSION: 0.5.0-beta
  KOF_SOURCE_COMMIT: bf17ac7e736471c8a04b4153e5b0f607be75e70c
  WINDOWS_JAVA_ARCHIVE_SHA256: e9cf542d5ffe2a894637b18c27a7802853976deaa3abe3e04dfbb8a307a145dd
  WINDOWS_JAVA_ARCHIVE_URL: https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27%2B35/OpenJDK27U-jre_x64_windows_hotspot_27_35.zip
  # Hosted runners are shared; keep the recorded 4 ms local target separate
  # from this scheduling-tolerant CI ceiling.
  KOOKIE_SERVER_P95_BUDGET_US: "8000"

jobs:
  verify:
    name: LSP, linter, compiler, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout pinned Kof source
        uses: actions/checkout@v5
        with:
          repository: KofLang/Kof4j
          ref: ${{ env.KOF_SOURCE_COMMIT }}
          path: _kof
          persist-credentials: false
      - name: Install Java runtime for Kof build and JVM artifacts
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned Zig cross-toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"


      - name: Build pinned Kof toolchain
        run: |
          set -euo pipefail
          # Concretize Kof's CI-friendly parent versions before shade resolves
          # the dependency-reduced POM; Maven otherwise requests ${revision}.
          mvn -q -f _kof/pom.xml flatten:flatten \
            -Drevision="$KOF_VERSION"
          for pom_dir in _kof _kof/kof-compiler _kof/kof-cli \
              _kof/kof-runtime _kof/kof-script _kof/kof-c-compiler; do
            cp -- "$pom_dir/.flattened-pom.xml" "$pom_dir/pom.xml"
          done
          mvn -q -f _kof/pom.xml clean package \
            -DskipTests -Drevision="$KOF_VERSION" \
            -DcreateDependencyReducedPom=false
          bash _kof/scripts/package.sh \
            --output "$RUNNER_TEMP/kof-dist" --skip-build
          archive="$RUNNER_TEMP/kof-dist/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          echo "KOOKIE_KOF_ARCHIVE_SHA256=$archive_sha256" >> "$GITHUB_ENV"
          echo "KOOKIE_KOF_SOURCE_COMMIT=$KOF_SOURCE_COMMIT" >> "$GITHUB_ENV"
          kof_bin="$RUNNER_TEMP/kof-dist/kof-${KOF_VERSION}-linux-x86_64/bin"
          echo "$kof_bin" >> "$GITHUB_PATH"
          export PATH="$kof_bin:$PATH"
          kof version
          rm -rf _kof
      - name: Download pinned Windows JVM runtime
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/OpenJDK27U-jre_x64_windows_hotspot_27_35.zip"
          curl --fail --location --retry 3 --output "$archive" \
            "$WINDOWS_JAVA_ARCHIVE_URL"
          echo "$WINDOWS_JAVA_ARCHIVE_SHA256  $archive" | sha256sum --check -
          echo "KOOKIE_WINDOWS_JAVA_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "KOOKIE_WINDOWS_JAVA_ARCHIVE_SHA256=$WINDOWS_JAVA_ARCHIVE_SHA256" \
            >> "$GITHUB_ENV"


      - name: Install Wine and initialize console prefix
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install \
            --no-install-recommends -y wine wine64 wine32:i386
          wine --version
          smoke_prefix="$RUNNER_TEMP/wine-ci-smoke"
          WINEARCH=win64 WINEPREFIX="$smoke_prefix" WINEDEBUG=-all \
            wineboot --init
          rm -rf -- "$smoke_prefix"
      - name: Run repository verification gate
        run: bash scripts/verify.sh
      - name: Verify reproducible Windows JVM package
        run: bash scripts/verify_windows_jvm_package.sh
      - name: Verify G6 runtime probes
        run: bash scripts/verify_g6_runtime.sh
      - name: Check demo release scripts
        run: |
          bash -n scripts/build_demo_release.sh \
            scripts/bootstrap_sdl3_mixer.sh \
            scripts/check_release_readiness.sh \
            scripts/sdl3_dependencies.sh \
            scripts/verify_linux_presentation_package.sh \
            scripts/verify_windows_presentation.sh \
            scripts/package_kookie.sh \
            scripts/verify_package.sh
