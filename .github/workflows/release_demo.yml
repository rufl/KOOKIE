name: Build KOOKIE demo release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer release version without a leading v"
        required: true
        type: string
      publish:
        description: "Publish the verified Linux/Windows pair after environment approval"
        required: true
        default: false
        type: boolean
      run_linux_presentation_smoke:
        description: "Run isolated Linux package presentation smoke on the release runner"
        required: true
        default: false
        type: boolean
      run_windows_wine_smoke:
        description: "Run optional isolated Wine package smoke on the release runner"
        required: true
        default: false
        type: boolean
      run_windows_presentation_smoke:
        description: "Run native Windows presentation smoke through the reviewed isolation wrapper"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: demo-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  KOF_VERSION: 0.6.0
  KOF_SOURCE_COMMIT: bb90986d065118e4f63978e8e6985256ff714203
  KOOKIE_KOF_SOURCE_COMMIT: bb90986d065118e4f63978e8e6985256ff714203
  ZIG_VERSION: 0.17.0
  ZIG_ARCHIVE_SHA256: b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428
  ZIG_ARCHIVE_URL: https://ziglang.org/download/0.17.0/zig-x86_64-windows-0.17.0.zip
jobs:
  toolchain:
    name: Build pinned Kof archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout KOOKIE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout pinned Kof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KofLang/Kof4j
          ref: ${{ env.KOF_SOURCE_COMMIT }}
          path: _kof
          persist-credentials: false
      - name: Install Java runtime for Kof build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "27"
      - name: Build pinned Kof distribution
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_kof_source.sh _kof "$KOF_VERSION"
          mvn -q -f _kof/pom.xml flatten:flatten \
            -Drevision="$KOF_VERSION"
          for pom_dir in _kof _kof/kof-compiler _kof/kof-cli \
              _kof/kof-runtime _kof/kof-script _kof/kof-c-compiler; do
            cp -- "$pom_dir/.flattened-pom.xml" "$pom_dir/pom.xml"
          done
          mvn -q -f _kof/pom.xml clean package \
            -DskipTests -Drevision="$KOF_VERSION" \
            -DcreateDependencyReducedPom=false
          bash _kof/scripts/package.sh \
            --output "$RUNNER_TEMP/kof-dist" --skip-build
          archive="$RUNNER_TEMP/kof-dist/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          test -f "$archive"
          artifact_dir="$RUNNER_TEMP/kookie-kof-artifact"
          mkdir -p "$artifact_dir"
          cp -- "$archive" "$artifact_dir/"
          (
            cd "$artifact_dir"
            sha256sum "$(basename "$archive")" > SHA256SUMS
            printf '%s\n' "$KOF_SOURCE_COMMIT" > SOURCE_COMMIT
          )
      - name: Upload pinned Kof archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-kof-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-kof-artifact
          if-no-files-found: error
          retention-days: 2

  linux:
    name: Linux x86-64 presentation package
    needs: [toolchain]
    runs-on: [self-hosted, linux, x64, kookie-demo-release]
    timeout-minutes: 60
    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download pinned Kof archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-kof-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-kof
      - name: Configure pinned Kof archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kookie-kof/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          checksum_file="$RUNNER_TEMP/kookie-kof/SHA256SUMS"
          source_file="$RUNNER_TEMP/kookie-kof/SOURCE_COMMIT"
          test -f "$archive"
          test -f "$checksum_file"
          test -f "$source_file"
          (
            cd "$(dirname "$archive")"
            sha256sum --check SHA256SUMS
          )
          [[ "$(tr -d '\r\n' <"$source_file")" == "$KOF_SOURCE_COMMIT" ]] || {
            echo 'release_demo: Kof archive source metadata disagrees with workflow pin' >&2
            exit 2
          }
          kof_root="$RUNNER_TEMP/kookie-kof/kof-${KOF_VERSION}-linux-x86_64"
          tar -xzf "$archive" -C "$RUNNER_TEMP/kookie-kof"
          kof_bin="$kof_root/bin"
          test -x "$kof_bin/kof"
          printf '%s\n' "$kof_bin" >> "$GITHUB_PATH"
          printf 'KOOKIE_KOF_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE_SHA256=%s\n' \
            "$(cut -d ' ' -f 1 "$checksum_file")" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_SOURCE_COMMIT=%s\n' "$KOF_SOURCE_COMMIT" \
            >> "$GITHUB_ENV"
          export PATH="$kof_bin:$PATH"
          [[ "$(kof version)" == "kof $KOF_VERSION" ]]
      - name: Configure isolated Linux presentation wrapper
        if: ${{ inputs.run_linux_presentation_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$GITHUB_WORKSPACE/scripts/linux_gamescope_isolated_display"
          test -x "$wrapper"
          command -v overzeer-isolated-display >/dev/null
          command -v gamescope >/dev/null
          printf '%s\n' "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          printf 'KOOKIE_PRESENTATION_ISOLATION_WRAPPER=%s\n' "$wrapper" \
            >> "$GITHUB_ENV"
          printf 'KOOKIE_PRESENTATION_DISPLAY_SERVER=%s\n' \
            'gamescope-headless-xwayland' >> "$GITHUB_ENV"
          printf 'KOOKIE_SDL_VIDEO_DRIVER=%s\n' 'x11' >> "$GITHUB_ENV"


      - name: Configure pinned Linux SDL3 prefix
        shell: bash
        run: |
          set -euo pipefail
          sdl3_prefix="$HOME/.local/share/kookie-deps/sdl/SDL3-3.4.18"
          test -f "$sdl3_prefix/include/SDL3/SDL_version.h"
          test -f "$sdl3_prefix/lib/pkgconfig/sdl3.pc"
          printf 'KOOKIE_SDL3_PREFIX=%s\n' "$sdl3_prefix" >> "$GITHUB_ENV"

      - name: Preflight Linux presentation capability
        if: ${{ inputs.run_linux_presentation_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="${KOOKIE_PRESENTATION_ISOLATION_WRAPPER:-}"
          [[ -n "$wrapper" ]] && command -v "$wrapper" >/dev/null || {
            echo 'release_demo: Linux presentation smoke requires KOOKIE_PRESENTATION_ISOLATION_WRAPPER' >&2
            exit 75
          }
          : "${KOOKIE_PRESENTATION_HARDWARE_ID:?set a stable target hardware identifier on the runner}"
          : "${KOOKIE_PRESENTATION_GPU_DRIVER:?set the target GPU driver identity on the runner}"

          render_node="${KOOKIE_RENDER_NODE:-}"
          if [[ -z "$render_node" ]]; then
            for candidate in /dev/dri/renderD*; do
              if [[ -c "$candidate" ]]; then
                render_node="$candidate"
                break
              fi
            done
          fi
          [[ -n "$render_node" && -c "$render_node" ]] || {
            echo 'release_demo: Linux presentation smoke requires a /dev/dri/renderD* node' >&2
            exit 75
          }
          printf 'KOOKIE_RENDER_NODE=%s\n' "$render_node" >>"$GITHUB_ENV"


      - name: Prepare release identity
        shell: bash
        env:
          KOOKIE_SIGNING_KEY_PEM: ${{ secrets.KOOKIE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          : "${KOOKIE_SIGNING_KEY_PEM:?KOOKIE_SIGNING_KEY_PEM is required}"
          source scripts/kof_pin.sh
          [[ "$KOOKIE_KOF_SOURCE_COMMIT" == "$KOF_PIN_SOURCE_COMMIT" ]] || {
            echo 'release_demo: workflow Kof source pin disagrees with scripts/kof_pin.sh' >&2
            exit 2
          }
          : "${KOOKIE_KOF_ARCHIVE_SHA256:?KOOKIE_KOF_ARCHIVE_SHA256 is required}"
          : "${KOOKIE_KOF_SOURCE_COMMIT:?Kof source commit is required}"
          : "${KOOKIE_KOF_ARCHIVE:?configure KOOKIE_KOF_ARCHIVE on this release runner}"
          [[ -f "$KOOKIE_KOF_ARCHIVE" && ! -L "$KOOKIE_KOF_ARCHIVE" ]] || {
            echo 'release_demo: KOOKIE_KOF_ARCHIVE must be a regular file' >&2
            exit 2
          }
          actual_kof_archive_sha256="$(sha256sum "$KOOKIE_KOF_ARCHIVE" | cut -d ' ' -f 1)"
          [[ "$actual_kof_archive_sha256" == "${KOOKIE_KOF_ARCHIVE_SHA256,,}" ]] || {
            echo 'release_demo: installed Kof archive does not match KOOKIE_KOF_ARCHIVE_SHA256' >&2
            exit 2
          }
          printf '%s\n' "$KOOKIE_SIGNING_KEY_PEM" >"$RUNNER_TEMP/kookie-signing.pem"
          chmod 600 "$RUNNER_TEMP/kookie-signing.pem"
          printf 'KOOKIE_SIGNING_KEY=%s\n' "$RUNNER_TEMP/kookie-signing.pem" >>"$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE_SHA256=%s\n' "$KOOKIE_KOF_ARCHIVE_SHA256" >>"$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE=%s\n' "$KOOKIE_KOF_ARCHIVE" >>"$GITHUB_ENV"
          actual_kof_version="$(kof version)"
          [[ "$actual_kof_version" == "$KOF_PIN_CLI_VERSION" ]] || {
            printf 'release_demo: expected %s; found %s\n' "$KOF_PIN_CLI_VERSION" "$actual_kof_version" >&2
            exit 2
          }
          zig version

      - name: Prepare pinned SDL_mixer development prefix
        shell: bash
        run: |
          set -euo pipefail
          source scripts/sdl3_dependencies.sh
          if ! kookie_prepare_sdl3_dependencies "$PWD"; then
            bash scripts/bootstrap_sdl3_mixer.sh
          fi

      - name: Build deterministic Linux artifact
        shell: bash
        env:
          DEMO_VERSION: ${{ inputs.version }}
          KOOKIE_CONTENT_PROFILE: none
        run: |
          set -euo pipefail
          scripts/build_demo_release.sh \
            --target linux-x86_64 \
            --version "$DEMO_VERSION" \
            --output "$RUNNER_TEMP/kookie-demo-linux"

      - name: Run isolated Linux package presentation smoke
        if: ${{ inputs.run_linux_presentation_smoke }}
        shell: bash
        env:
          DEMO_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          : "${KOOKIE_PRESENTATION_ISOLATION_WRAPPER:?configure an isolated presentation wrapper on this runner}"
          KOOKIE_PACKAGE_DIR="$RUNNER_TEMP/kookie-demo-linux" \
          KOOKIE_PACKAGE_NAME="kookie-${DEMO_VERSION}-linux-x86_64" \
          KOOKIE_PRESENTATION_EVIDENCE_DIR="$RUNNER_TEMP/kookie-d1-evidence-linux" \
          KOOKIE_RUN_PRESENTATION=1 \
            scripts/verify_linux_presentation_package.sh

      - name: Upload Linux artifact set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-demo-linux-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-demo-linux
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux presentation evidence
        if: ${{ inputs.run_linux_presentation_smoke }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-d1-presentation-evidence-linux-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-d1-evidence-linux
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x86-64 presentation package
    needs: [toolchain]
    runs-on: [self-hosted, windows, x64, kookie-demo-release]
    timeout-minutes: 60
    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download pinned Kof archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-kof-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-kof
      - name: Configure pinned Windows release tools
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          archive="$runner_temp/kookie-kof/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          checksum_file="$runner_temp/kookie-kof/SHA256SUMS"
          source_file="$runner_temp/kookie-kof/SOURCE_COMMIT"
          test -f "$archive"
          test -f "$checksum_file"
          test -f "$source_file"
          (
            cd "$(dirname "$archive")"
            sha256sum --check SHA256SUMS
          )
          [[ "$(tr -d '\r\n' <"$source_file")" == "$KOF_SOURCE_COMMIT" ]] || {
            echo 'release_demo: Kof archive source metadata disagrees with workflow pin' >&2
            exit 2
          }
          kof_root="$runner_temp/kookie-kof/kof-${KOF_VERSION}-linux-x86_64"
          tar -xzf "$archive" -C "$runner_temp/kookie-kof"
          kof_bin="$kof_root/bin"
          test -f "$kof_bin/kof"
          printf '%s\n' "$kof_bin" >> "$GITHUB_PATH"
          printf 'KOOKIE_KOF_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE_SHA256=%s\n' \
            "$(cut -d ' ' -f 1 "$checksum_file")" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_SOURCE_COMMIT=%s\n' "$KOF_SOURCE_COMMIT" \
            >> "$GITHUB_ENV"
          export PATH="$kof_bin:$PATH"
          [[ "$(kof version)" == "kof $KOF_VERSION" ]]

          zig_archive="$runner_temp/zig-x86_64-windows-${ZIG_VERSION}.zip"
          zig_install="$runner_temp/zig-x86_64-windows-${ZIG_VERSION}"
          curl --fail --location --retry 3 --output "$zig_archive" \
            "$ZIG_ARCHIVE_URL"
          echo "$ZIG_ARCHIVE_SHA256  $zig_archive" | sha256sum --check -
          rm -rf -- "$zig_install"
          python3 - "$zig_archive" "$runner_temp" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  target = (destination / entry.filename).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f"unsafe Zig archive entry: {entry.filename}")
              source.extractall(destination)
          PY
          test -x "$zig_install/zig.exe"
          printf '%s\n' "$zig_install" >> "$GITHUB_PATH"
          export PATH="$zig_install:$PATH"
          [[ "$(zig version)" == "$ZIG_VERSION" ]]

          wrapper="$workspace/scripts/windows_isolated_display"
          test -x "$wrapper"
          printf '%s\n' "$workspace/scripts" >> "$GITHUB_PATH"
          printf 'KOOKIE_WINDOWS_PRESENTATION_ISOLATION_WRAPPER=%s\n' \
            "$wrapper" >> "$GITHUB_ENV"
          if [[ "${{ inputs.run_windows_presentation_smoke }}" == true ]]; then
            powershell_path=/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
            gpu_json="$runner_temp/kookie-gpu.json"
            "$powershell_path" -NoLogo -NoProfile -NonInteractive -Command \
              '$ErrorActionPreference="Stop"; $gpu=Get-CimInstance Win32_VideoController | Where-Object { $_.PNPDeviceID -like "PCI*" } | Select-Object -First 1 Name,DriverVersion,PNPDeviceID; if ($null -eq $gpu) { throw "no PCI display adapter found" }; $gpu | ConvertTo-Json -Compress' \
              >"$gpu_json"
            mapfile -t gpu_identity < <(python3 - "$gpu_json" <<'PY'
          import json
          import pathlib
          import sys

          gpu = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("PNPDeviceID", "Name", "DriverVersion"):
              value = gpu.get(key)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"missing Windows GPU field: {key}")
              print(value.replace("\r", " ").replace("\n", " ").strip())
          PY
            )
            [[ "${#gpu_identity[@]}" == 3 ]]
            printf 'KOOKIE_PRESENTATION_HARDWARE_ID=%s\n' "${gpu_identity[0]}" \
              >> "$GITHUB_ENV"
            printf 'KOOKIE_PRESENTATION_GPU_DRIVER=%s %s\n' \
              "${gpu_identity[1]}" "${gpu_identity[2]}" >> "$GITHUB_ENV"
            printf 'Windows presentation target: %s (%s)\n' \
              "${gpu_identity[1]}" "${gpu_identity[2]}"
          fi

      - name: Preflight Windows presentation capability
        if: ${{ inputs.run_windows_presentation_smoke || inputs.run_windows_wine_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.run_windows_presentation_smoke }}" == true ]]; then
            wrapper="${KOOKIE_WINDOWS_PRESENTATION_ISOLATION_WRAPPER:-}"
            [[ -n "$wrapper" ]] && command -v "$wrapper" >/dev/null || {
              echo 'release_demo: native Windows presentation smoke requires KOOKIE_WINDOWS_PRESENTATION_ISOLATION_WRAPPER' >&2
              exit 75
            }
            : "${KOOKIE_PRESENTATION_HARDWARE_ID:?set a stable target hardware identifier on the runner}"
            : "${KOOKIE_PRESENTATION_GPU_DRIVER:?set the target GPU driver identity on the runner}"

          fi
          if [[ "${{ inputs.run_windows_wine_smoke }}" == true ]]; then
            command -v wine >/dev/null || {
              echo 'release_demo: Wine smoke requires wine' >&2
              exit 2
            }
            command -v overzeer-isolated-display >/dev/null || {
              echo 'release_demo: Wine smoke requires overzeer-isolated-display' >&2
              exit 2
            }
          fi


      - name: Prepare release identity
        shell: bash
        env:
          KOOKIE_SIGNING_KEY_PEM: ${{ secrets.KOOKIE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          : "${KOOKIE_SIGNING_KEY_PEM:?KOOKIE_SIGNING_KEY_PEM is required}"
          source scripts/kof_pin.sh
          [[ "$KOOKIE_KOF_SOURCE_COMMIT" == "$KOF_PIN_SOURCE_COMMIT" ]] || {
            echo 'release_demo: workflow Kof source pin disagrees with scripts/kof_pin.sh' >&2
            exit 2
          }
          : "${KOOKIE_KOF_ARCHIVE_SHA256:?KOOKIE_KOF_ARCHIVE_SHA256 is required}"
          : "${KOOKIE_KOF_SOURCE_COMMIT:?Kof source commit is required}"
          : "${KOOKIE_KOF_ARCHIVE:?configure KOOKIE_KOF_ARCHIVE on this release runner}"
          [[ -f "$KOOKIE_KOF_ARCHIVE" && ! -L "$KOOKIE_KOF_ARCHIVE" ]] || {
            echo 'release_demo: KOOKIE_KOF_ARCHIVE must be a regular file' >&2
            exit 2
          }
          actual_kof_archive_sha256="$(sha256sum "$KOOKIE_KOF_ARCHIVE" | cut -d ' ' -f 1)"
          [[ "$actual_kof_archive_sha256" == "${KOOKIE_KOF_ARCHIVE_SHA256,,}" ]] || {
            echo 'release_demo: installed Kof archive does not match KOOKIE_KOF_ARCHIVE_SHA256' >&2
            exit 2
          }
          : "${KOOKIE_WINDOWS_SDL_PREFIX:?configure KOOKIE_WINDOWS_SDL_PREFIX on this runner}"
          : "${KOOKIE_WINDOWS_SDL_MIXER_PREFIX:?configure KOOKIE_WINDOWS_SDL_MIXER_PREFIX on this runner}"
          : "${KOOKIE_DXC:?configure KOOKIE_DXC on this runner}"
          printf '%s\n' "$KOOKIE_SIGNING_KEY_PEM" >"$RUNNER_TEMP/kookie-signing.pem"
          chmod 600 "$RUNNER_TEMP/kookie-signing.pem"
          printf 'KOOKIE_SIGNING_KEY=%s\n' "$RUNNER_TEMP/kookie-signing.pem" >>"$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE_SHA256=%s\n' "$KOOKIE_KOF_ARCHIVE_SHA256" >>"$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE=%s\n' "$KOOKIE_KOF_ARCHIVE" >>"$GITHUB_ENV"
          actual_kof_version="$(kof version)"
          [[ "$actual_kof_version" == "$KOF_PIN_CLI_VERSION" ]] || {
            printf 'release_demo: expected %s; found %s\n' "$KOF_PIN_CLI_VERSION" "$actual_kof_version" >&2
            exit 2
          }
          zig version
          "$KOOKIE_DXC" --version

      - name: Build deterministic Windows artifact
        shell: bash
        env:
          DEMO_VERSION: ${{ inputs.version }}
          KOOKIE_CONTENT_PROFILE: none
        run: |
          set -euo pipefail
          scripts/build_demo_release.sh \
            --target windows-x86_64 \
            --version "$DEMO_VERSION" \
            --output "$RUNNER_TEMP/kookie-demo-windows"

      - name: Run Windows artifact gate
        shell: bash
        env:
          KOOKIE_RUN_WINE: ${{ inputs.run_windows_wine_smoke && '1' || '0' }}
          KOOKIE_RUN_NATIVE_PRESENTATION: ${{ inputs.run_windows_presentation_smoke && '1' || '0' }}
          KOOKIE_PRESENTATION_EVIDENCE_DIR: ${{ runner.temp }}/kookie-d1-evidence-windows
        run: |
          set -euo pipefail
          scripts/verify_windows_presentation.sh

      - name: Upload Windows artifact set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-demo-windows-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-demo-windows
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows presentation evidence
        if: ${{ inputs.run_windows_presentation_smoke }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-d1-presentation-evidence-windows-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-d1-evidence-windows
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved Linux/Windows pair
    if: ${{ inputs.publish }}
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: kookie-demo-release
    permissions:
      contents: write
    steps:
      - name: Require target hardware evidence for publication
        shell: bash
        env:
          RUN_LINUX_PRESENTATION_SMOKE: ${{ inputs.run_linux_presentation_smoke }}
          RUN_WINDOWS_PRESENTATION_SMOKE: ${{ inputs.run_windows_presentation_smoke }}
        run: |
          set -euo pipefail
          [[ "$RUN_LINUX_PRESENTATION_SMOKE" == true ]] || {
            echo 'release_demo: publish requires run_linux_presentation_smoke=true' >&2
            exit 2
          }
          [[ "$RUN_WINDOWS_PRESENTATION_SMOKE" == true ]] || {
            echo 'release_demo: publish requires run_windows_presentation_smoke=true' >&2
            exit 2
          }

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Linux artifact set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-demo-linux-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-demo-linux

      - name: Download Windows artifact set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-demo-windows-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-demo-windows

      - name: Download Linux presentation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-d1-presentation-evidence-linux-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-d1-evidence-linux

      - name: Download Windows presentation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-d1-presentation-evidence-windows-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-d1-evidence-windows

      - name: Assemble paired checksums and qualification manifest
        shell: bash
        env:
          KOOKIE_SIGNING_KEY_PEM: ${{ secrets.KOOKIE_SIGNING_KEY_PEM }}
          DEMO_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          : "${KOOKIE_SIGNING_KEY_PEM:?KOOKIE_SIGNING_KEY_PEM is required}"
          command -v gh >/dev/null
          publish_dir="$RUNNER_TEMP/kookie-demo-publish"
          mkdir -p "$publish_dir"
          for target in linux windows; do
            source_dir="$RUNNER_TEMP/kookie-demo-$target"
            find "$source_dir" -maxdepth 1 -type f \
              ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.sig' \
              ! -name 'BUILD_SUMMARY.txt' \
              ! -name 'QUALIFICATION_MANIFEST.json' -exec cp -- {} "$publish_dir/" \;
            cp -- "$source_dir/BUILD_SUMMARY.txt" \
              "$publish_dir/BUILD_SUMMARY-$target.txt"
          done
          signing_key="$RUNNER_TEMP/kookie-signing.pem"
          printf '%s\n' "$KOOKIE_SIGNING_KEY_PEM" >"$signing_key"
          chmod 600 "$signing_key"
          python3 scripts/build_release_qualification.py \
            "$publish_dir/RELEASE_QUALIFICATION.json" \
            --package-manifest "linux=$RUNNER_TEMP/kookie-demo-linux/kookie-${DEMO_VERSION}-linux-x86_64.json" \
            --package-manifest "windows=$RUNNER_TEMP/kookie-demo-windows/kookie-${DEMO_VERSION}-windows-x86_64.json" \
            --evidence "linux=$RUNNER_TEMP/kookie-d1-evidence-linux/evidence.json" \
            --evidence "windows=$RUNNER_TEMP/kookie-d1-evidence-windows/evidence.json" \
            --require-hardware
          openssl pkeyutl -sign -rawin -inkey "$signing_key" \
            -in "$publish_dir/RELEASE_QUALIFICATION.json" \
            -out "$publish_dir/RELEASE_QUALIFICATION.json.sig"
          mapfile -t assets < <(
            cd "$publish_dir"
            printf '%s\n' kookie-* RELEASE_QUALIFICATION.json \
              RELEASE_QUALIFICATION.json.sig | sort
          )
          (cd "$publish_dir" && sha256sum "${assets[@]}" > SHA256SUMS)
          openssl pkeyutl -sign -rawin -inkey "$signing_key" \
            -in "$publish_dir/SHA256SUMS" -out "$publish_dir/SHA256SUMS.sig"
          public_key="$publish_dir/kookie-${DEMO_VERSION}-linux-x86_64.pub.pem"
          openssl pkeyutl -verify -rawin -pubin -inkey "$public_key" \
            -in "$publish_dir/RELEASE_QUALIFICATION.json" \
            -sigfile "$publish_dir/RELEASE_QUALIFICATION.json.sig" >/dev/null
          openssl pkeyutl -verify -rawin -pubin -inkey "$public_key" \
            -in "$publish_dir/SHA256SUMS" \
            -sigfile "$publish_dir/SHA256SUMS.sig" >/dev/null
          source_commit="$(git rev-parse HEAD)"
          cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          # KOOKIE $DEMO_VERSION

          Signed native presentation packages built from source commit
          \`$source_commit\` with Kof source commit
          \`${KOOKIE_KOF_SOURCE_COMMIT:-bb90986d065118e4f63978e8e6985256ff714203}\`.

          This bounded first demo contains local \`Play\`, fixed two-player
          \`Host/Join\`, explicit \`READY\` gating and the host-authoritative
          \`Tab\` player screen. Networking remains direct-IPv4 dogfood with no
          relay, public identity service or production DDoS protection.

          Verify \`SHA256SUMS\` and \`SHA256SUMS.sig\` before extraction.
          \`RELEASE_QUALIFICATION.json\` is the canonical paired artifact and
          records the target-specific hardware evidence required for publication.
          EOF
          printf 'KOOKIE paired release assets prepared in %s\n' "$publish_dir"

      - name: Create GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$DEMO_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "KOOKIE $DEMO_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$DEMO_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/kookie-demo-publish"/* \
            --clobber
