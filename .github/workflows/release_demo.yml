name: Build KOOKIE demo release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer release version without a leading v"
        required: true
        type: string
      source_commit:
        description: "Immutable KOOKIE commit to qualify and publish"
        required: true
        type: string
      publish:
        description: "Publish the verified Linux/Windows pair after environment approval"
        required: true
        default: false
        type: boolean
      run_linux_presentation_smoke:
        description: "Run isolated Linux package presentation smoke on the release runner"
        required: true
        default: false
        type: boolean
      run_windows_wine_smoke:
        description: "Run optional isolated Wine package smoke on the release runner"
        required: true
        default: false
        type: boolean
      run_windows_presentation_smoke:
        description: "Run native Windows presentation smoke through the reviewed isolation wrapper"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: demo-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  KOF_VERSION: 0.6.5
  KOF_SOURCE_COMMIT: a14a7cd47d74192dcc977c9d4cbf87d407694560
  KOOKIE_KOF_SOURCE_COMMIT: a14a7cd47d74192dcc977c9d4cbf87d407694560
  KOF_PATCH_SHA256: 746b95235341e463bedc9b4d960ce1607d7d23e5340619ca67e1c12c9a8bbb25
  KOOKIE_KOF_BUILD_TIMEOUT_SECONDS: "5400"
  KOOKIE_KOF_BUILD_HEARTBEAT_SECONDS: "30"
  KOOKIE_KOF_BUILD_KILL_AFTER_SECONDS: "30"
  ZIG_VERSION: 0.17.0
  ZIG_ARCHIVE_SHA256: b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428
  ZIG_ARCHIVE_URL: https://ziglang.org/download/0.17.0/zig-x86_64-windows-0.17.0.zip
  ZIG_LINUX_ARCHIVE_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
  ZIG_LINUX_ARCHIVE_URL: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
  MINGW_PKGCONF_VERSION: "1~3.0.8-1"
  MINGW_PKGCONF_ARCHIVE_URL: https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-pkgconf-1~3.0.8-1-any.pkg.tar.zst
  MINGW_PKGCONF_ARCHIVE_SHA256: b8ef0afd0f5da42c40a455491148c6e8ca5436ab2f0167f0a93074d4eeb9249b
  ZSTD_VERSION: 1.5.7
  ZSTD_ARCHIVE_URL: https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip
  ZSTD_ARCHIVE_SHA256: acb4e8111511749dc7a3ebedca9b04190e37a17afeb73f55d4425dbf0b90fad9
  MINGW_TEXT_PACKAGE_SET: freetype-2.15.0-harfbuzz-14.6.0-runtime-16.2.0
  MINGW_TEXT_PACKAGE_BASE_URL: https://repo.msys2.org/mingw/mingw64
  MINGW_TEXT_PACKAGE_MANIFEST: |
    mingw-w64-x86_64-freetype-2.15.0-1-any.pkg.tar.zst|426bd4e0e979118682be881ace475ef4d3ff1668084ac796350fb7e0504b82ef
    mingw-w64-x86_64-harfbuzz-14.6.0-1-any.pkg.tar.zst|23a9b505159b3b9086ca918cc437c20e496d2f411aa25a050bd82b1070a079d1
    mingw-w64-x86_64-libgcc-16.2.0-6-any.pkg.tar.zst|e0815432c4225892b0eef57055fe507fa0b9a036436f046605f6629696bd1b88
    mingw-w64-x86_64-libstdc%2B%2B-16.2.0-6-any.pkg.tar.zst|924b47e8c3e20b6448e29d3333acc638a4f4783c1c45230e09673532f9c4f198
    mingw-w64-x86_64-gettext-runtime-1.0-1-any.pkg.tar.zst|be68d7f260633284b910c588c6d82ee304a81c8817a686d2cd9df83f872c27af
    mingw-w64-x86_64-brotli-1.2.0-1-any.pkg.tar.zst|f5f2f7e723a08378241d15f0537386950c1a48e2d82bc47bedd632bd61852aba
    mingw-w64-x86_64-bzip2-1.0.8-4-any.pkg.tar.zst|123768f30ae14ba654a6feb70f8526146a331bc85f831a91a549ffb3f6cbffc7
    mingw-w64-x86_64-libpng-1.6.59-1-any.pkg.tar.zst|e1830319ea6c601c1e4d146b8e78264bcbb6326f0935b82c14a9b282af2127e1
    mingw-w64-x86_64-zlib-1.3.2-2-any.pkg.tar.zst|9e75842a070ba648e986e12424e1c92c9d7d77200e85f6a34eeb600819f2e694
    mingw-w64-x86_64-glib2-2.90.1-1-any.pkg.tar.zst|152ba3b2cfb35feebc0fcb690889b16a6f0c2b89ced52e65aea45d089f86d219
    mingw-w64-x86_64-graphite2-1.3.15-1-any.pkg.tar.zst|6ad20d6c16e559f7c4b06fe71248e1201c7edf494d04e5721ed7f9b3f7fd1f74
    mingw-w64-x86_64-libffi-3.8.0-1-any.pkg.tar.zst|6dad7f3c6c900d3c64a4fe0c2764b405e678b22df3521d2284ffaeff0198b84b
    mingw-w64-x86_64-pcre2-10.49-1-any.pkg.tar.zst|0abc5313085a0f9b4a77a1580d92b09761371cb3a1f31d01051a94a289fb9413
    mingw-w64-x86_64-libiconv-1.19-1-any.pkg.tar.zst|21e334d0911f25de75d3e18e0697648bcecfa9658256d600cad0827d719c2f35
    mingw-w64-x86_64-libwinpthread-14.0.0.r426.g4564ee4b5-2-any.pkg.tar.zst|ac791deaf730ef7aa6fa66f31ce6ec53a02c43fa85562233a981c84c93456760
  SDL3_VERSION: 3.4.18
  SDL3_ARCHIVE_URL: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-mingw.tar.gz
  SDL3_ARCHIVE_SHA256: 049b9dd711e3fb3f8d84feb998dfec54a75e17cf539c4a80ff4d058d839771cf
  SDL3_MIXER_VERSION: 3.2.4
  SDL3_MIXER_ARCHIVE_URL: https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.4/SDL3_mixer-devel-3.2.4-mingw.tar.gz
  SDL3_MIXER_ARCHIVE_SHA256: 2ff5f59be4683e0afb4339c4fa73c6228651e52d37b040ecf80da08edb3cecd6
jobs:
  toolchain:
    name: Build pinned Kof archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate immutable source commit
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_demo: source_commit must be a 40-character lowercase commit SHA' >&2
            exit 2
          }
      - name: Checkout KOOKIE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Cache pinned Kof archive
        id: kof-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kookie/kof
          key: kookie-kof-linux-${{ env.KOF_VERSION }}-${{ env.KOF_SOURCE_COMMIT }}-${{ env.KOF_PATCH_SHA256 }}
      - name: Checkout pinned Kof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KofLang/Kof4j
          ref: ${{ env.KOF_SOURCE_COMMIT }}
          path: _kof
          persist-credentials: false
      - name: Install Java runtime for Kof build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
          cache-dependency-path: _kof/pom.xml
      - name: Build pinned Kof distribution
        if: steps.kof-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_kof_source.sh _kof "$KOF_VERSION"
          patch_file="$GITHUB_WORKSPACE/patches/kof-native-emitter-performance.patch"
          test -f "$patch_file"
          test "$(sha256sum "$patch_file" | cut -d ' ' -f 1)" = "$KOF_PATCH_SHA256"
          git -C _kof apply --check "$patch_file"
          git -C _kof apply "$patch_file"
          mvn -q -f _kof/pom.xml flatten:flatten \
            -Drevision="$KOF_VERSION"
          for pom_dir in _kof _kof/kof-compiler _kof/kof-cli \
              _kof/kof-runtime _kof/kof-script _kof/kof-c-compiler; do
            cp -- "$pom_dir/.flattened-pom.xml" "$pom_dir/pom.xml"
          done
          mvn -q -f _kof/pom.xml clean package \
            -DskipTests -Drevision="$KOF_VERSION" \
            -DcreateDependencyReducedPom=false
          artifact_dir="$HOME/.cache/kookie/kof"
          rm -rf -- "$artifact_dir"
          mkdir -p "$artifact_dir"
          bash _kof/scripts/package.sh \
            --output "$artifact_dir" --skip-build
          archive="$artifact_dir/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          test -f "$archive"
          (
            cd "$artifact_dir"
            sha256sum "$(basename "$archive")" > SHA256SUMS
            printf '%s\n' "$KOF_SOURCE_COMMIT" > SOURCE_COMMIT
          )
          rm -rf -- _kof
      - name: Validate pinned Kof archive
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$HOME/.cache/kookie/kof"
          archive="$artifact_dir/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          test -f "$archive"
          (cd "$artifact_dir" && sha256sum --check SHA256SUMS)
          [[ "$(tr -d '\r\n' < "$artifact_dir/SOURCE_COMMIT")" == "$KOF_SOURCE_COMMIT" ]]
          upload_dir="$RUNNER_TEMP/kookie-kof-artifact"
          rm -rf -- "$upload_dir"
          mkdir -p "$upload_dir"
          cp "$artifact_dir"/kof-*.tar.gz "$artifact_dir"/SHA256SUMS \
            "$artifact_dir"/SOURCE_COMMIT "$upload_dir"/
      - name: Upload pinned Kof archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-kof-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-kof-artifact
          if-no-files-found: error
          retention-days: 2

  linux:
    name: Linux x86-64 presentation package
    needs: [toolchain]
    runs-on: [self-hosted, linux, x64, kookie-demo-release]
    timeout-minutes: 120
    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Download pinned Kof archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-kof-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-kof
      - name: Configure pinned Kof archive
        shell: bash
        run: |
          set -euo pipefail
          printf 'KOOKIE_BUILD_LOG_DIR=%s\n' "$RUNNER_TEMP/kookie-build-logs" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_BUILD_HISTORY_DIR=%s\n' "$RUNNER_TEMP/kookie-build-history" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/kookie-kof/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          checksum_file="$RUNNER_TEMP/kookie-kof/SHA256SUMS"
          source_file="$RUNNER_TEMP/kookie-kof/SOURCE_COMMIT"
          test -f "$archive"
          test -f "$checksum_file"
          test -f "$source_file"
          (
            cd "$(dirname "$archive")"
            sha256sum --check SHA256SUMS
          )
          [[ "$(tr -d '\r\n' <"$source_file")" == "$KOF_SOURCE_COMMIT" ]] || {
            echo 'release_demo: Kof archive source metadata disagrees with workflow pin' >&2
            exit 2
          }
          kof_root="$RUNNER_TEMP/kookie-kof/kof-${KOF_VERSION}-linux-x86_64"
          tar -xzf "$archive" -C "$RUNNER_TEMP/kookie-kof"
          kof_bin="$kof_root/bin"
          test -x "$kof_bin/kof"
          printf '%s\n' "$kof_bin" >> "$GITHUB_PATH"
          printf 'KOOKIE_KOF_BIN_DIR=%s\n' "$kof_bin" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE_SHA256=%s\n' \
            "$(cut -d ' ' -f 1 "$checksum_file")" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_SOURCE_COMMIT=%s\n' "$KOF_SOURCE_COMMIT" \
            >> "$GITHUB_ENV"
          export PATH="$kof_bin:$PATH"
          [[ "$(kof version)" == "kof $KOF_VERSION" ]]
      - name: Cache pinned Linux Zig archive
        id: linux-zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kookie/toolchains/zig
          key: kookie-release-zig-linux-${{ env.ZIG_VERSION }}-${{ env.ZIG_LINUX_ARCHIVE_SHA256 }}
      - name: Install pinned Linux Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          zig_dir=""
          if [[ -n "${KOOKIE_ZIG_BIN:-}" ]]; then
            test -x "$KOOKIE_ZIG_BIN"
            [[ "$("$KOOKIE_ZIG_BIN" version)" == "$ZIG_VERSION" ]] || {
              echo 'release_demo: KOOKIE_ZIG_BIN version disagrees with pinned Zig version' >&2
              exit 2
            }
            if [[ -n "${KOOKIE_ZIG_BINARY_SHA256:-}" ]]; then
              actual_zig_binary_sha256="$(sha256sum "$KOOKIE_ZIG_BIN" | cut -d ' ' -f 1)"
              [[ "$actual_zig_binary_sha256" == "${KOOKIE_ZIG_BINARY_SHA256,,}" ]] || {
                echo 'release_demo: KOOKIE_ZIG_BIN digest disagrees with runner pin' >&2
                exit 2
              }
            fi
            zig_dir="$(dirname "$KOOKIE_ZIG_BIN")"
          else
            cache_dir="$HOME/.cache/kookie/toolchains/zig"
            mkdir -p "$cache_dir"
            archive="$cache_dir/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
            install_dir="$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}"
            if [[ ! -f "$archive" ]]; then
              curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
                --output "$archive" "$ZIG_LINUX_ARCHIVE_URL"
            fi
            echo "$ZIG_LINUX_ARCHIVE_SHA256  $archive" | sha256sum --check -
            rm -rf -- "$install_dir"
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            test -x "$install_dir/zig"
            zig_dir="$install_dir"
          fi
          printf '%s\n' "$zig_dir" >> "$GITHUB_PATH"
          printf 'KOOKIE_ZIG_VERSION=%s\n' "$ZIG_VERSION" >> "$GITHUB_ENV"
          printf 'KOOKIE_ZIG_ARCHIVE_SHA256=%s\n' \
            "$ZIG_LINUX_ARCHIVE_SHA256" >> "$GITHUB_ENV"
          export PATH="$zig_dir:$PATH"
          [[ "$(zig version)" == "$ZIG_VERSION" ]]
      - name: Configure isolated Linux presentation wrapper
        if: ${{ inputs.run_linux_presentation_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$GITHUB_WORKSPACE/scripts/linux_gamescope_isolated_display"
          test -x "$wrapper"
          command -v overzeer-isolated-display >/dev/null
          command -v gamescope >/dev/null
          printf '%s\n' "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          printf 'KOOKIE_PRESENTATION_ISOLATION_WRAPPER=%s\n' "$wrapper" \
            >> "$GITHUB_ENV"
          printf 'KOOKIE_PRESENTATION_DISPLAY_SERVER=%s\n' \
            'gamescope-headless-xwayland' >> "$GITHUB_ENV"
          printf 'KOOKIE_SDL_VIDEO_DRIVER=%s\n' 'x11' >> "$GITHUB_ENV"


      - name: Configure pinned Linux SDL3 prefix
        shell: bash
        run: |
          set -euo pipefail
          sdl3_prefix="$HOME/.local/share/kookie-deps/sdl/SDL3-3.4.18"
          test -f "$sdl3_prefix/include/SDL3/SDL_version.h"
          test -f "$sdl3_prefix/lib/pkgconfig/sdl3.pc"
          printf 'KOOKIE_SDL3_PREFIX=%s\n' "$sdl3_prefix" >> "$GITHUB_ENV"

      - name: Preflight Linux presentation capability
        if: ${{ inputs.run_linux_presentation_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="${KOOKIE_PRESENTATION_ISOLATION_WRAPPER:-}"
          [[ -n "$wrapper" ]] && command -v "$wrapper" >/dev/null || {
            echo 'release_demo: Linux presentation smoke requires KOOKIE_PRESENTATION_ISOLATION_WRAPPER' >&2
            exit 75
          }
          : "${KOOKIE_PRESENTATION_HARDWARE_ID:?set a stable target hardware identifier on the runner}"
          : "${KOOKIE_PRESENTATION_GPU_DRIVER:?set the target GPU driver identity on the runner}"

          render_node="${KOOKIE_RENDER_NODE:-}"
          if [[ -z "$render_node" ]]; then
            for candidate in /dev/dri/renderD*; do
              if [[ -c "$candidate" ]]; then
                render_node="$candidate"
                break
              fi
            done
          fi
          [[ -n "$render_node" && -c "$render_node" ]] || {
            echo 'release_demo: Linux presentation smoke requires a /dev/dri/renderD* node' >&2
            exit 75
          }
          printf 'KOOKIE_RENDER_NODE=%s\n' "$render_node" >>"$GITHUB_ENV"


      - name: Prepare release identity
        shell: bash
        env:
          KOOKIE_SIGNING_KEY_PEM: ${{ secrets.KOOKIE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          : "${KOOKIE_SIGNING_KEY_PEM:?KOOKIE_SIGNING_KEY_PEM is required}"
          source scripts/kof_pin.sh
          [[ "$KOOKIE_KOF_SOURCE_COMMIT" == "$KOF_PIN_SOURCE_COMMIT" ]] || {
            echo 'release_demo: workflow Kof source pin disagrees with scripts/kof_pin.sh' >&2
            exit 2
          }
          : "${KOOKIE_KOF_ARCHIVE_SHA256:?KOOKIE_KOF_ARCHIVE_SHA256 is required}"
          : "${KOOKIE_KOF_SOURCE_COMMIT:?Kof source commit is required}"
          : "${KOOKIE_KOF_ARCHIVE:?configure KOOKIE_KOF_ARCHIVE on this release runner}"
          [[ -f "$KOOKIE_KOF_ARCHIVE" && ! -L "$KOOKIE_KOF_ARCHIVE" ]] || {
            echo 'release_demo: KOOKIE_KOF_ARCHIVE must be a regular file' >&2
            exit 2
          }
          actual_kof_archive_sha256="$(sha256sum "$KOOKIE_KOF_ARCHIVE" | cut -d ' ' -f 1)"
          [[ "$actual_kof_archive_sha256" == "${KOOKIE_KOF_ARCHIVE_SHA256,,}" ]] || {
            echo 'release_demo: installed Kof archive does not match KOOKIE_KOF_ARCHIVE_SHA256' >&2
            exit 2
          }
          printf '%s\n' "$KOOKIE_SIGNING_KEY_PEM" >"$RUNNER_TEMP/kookie-signing.pem"
          chmod 600 "$RUNNER_TEMP/kookie-signing.pem"
          printf 'KOOKIE_SIGNING_KEY=%s\n' "$RUNNER_TEMP/kookie-signing.pem" >>"$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE_SHA256=%s\n' "$KOOKIE_KOF_ARCHIVE_SHA256" >>"$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE=%s\n' "$KOOKIE_KOF_ARCHIVE" >>"$GITHUB_ENV"
          actual_kof_version="$(kof version)"
          [[ "$actual_kof_version" == "$KOF_PIN_CLI_VERSION" ]] || {
            printf 'release_demo: expected %s; found %s\n' "$KOF_PIN_CLI_VERSION" "$actual_kof_version" >&2
            exit 2
          }
          zig version

      - name: Prepare pinned SDL_mixer development prefix
        shell: bash
        run: |
          set -euo pipefail
          source scripts/sdl3_dependencies.sh
          if ! kookie_prepare_sdl3_dependencies "$PWD"; then
            bash scripts/bootstrap_sdl3_mixer.sh
          fi
      - name: Preflight Linux release runner
        run: bash scripts/runner_preflight.sh release-linux

      - name: Build deterministic Linux artifact
        shell: bash
        env:
          DEMO_VERSION: ${{ inputs.version }}
          KOOKIE_CONTENT_PROFILE: none
        run: |
          set -euo pipefail
          bash scripts/ci_timed.sh linux-release \
            scripts/build_demo_release.sh \
            --target linux-x86_64 \
            --version "$DEMO_VERSION" \
            --output "$RUNNER_TEMP/kookie-demo-linux"

      - name: Run isolated Linux package presentation smoke
        if: ${{ inputs.run_linux_presentation_smoke }}
        shell: bash
        env:
          DEMO_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          : "${KOOKIE_PRESENTATION_ISOLATION_WRAPPER:?configure an isolated presentation wrapper on this runner}"
          bash scripts/ci_timed.sh linux-presentation env \
            KOOKIE_PACKAGE_DIR="$RUNNER_TEMP/kookie-demo-linux" \
            KOOKIE_PACKAGE_NAME="kookie-${DEMO_VERSION}-linux-x86_64" \
            KOOKIE_PRESENTATION_EVIDENCE_DIR="$RUNNER_TEMP/kookie-d1-evidence-linux" \
            KOOKIE_RUN_PRESENTATION=1 \
            scripts/verify_linux_presentation_package.sh

      - name: Upload Linux artifact set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-demo-linux-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-demo-linux
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux presentation evidence
        if: ${{ inputs.run_linux_presentation_smoke }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-d1-presentation-evidence-linux-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-d1-evidence-linux
          if-no-files-found: error
          retention-days: 30

      - name: Upload Kof build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-kof-build-diagnostics-linux-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-build-logs
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows x86-64 presentation package
    needs: [toolchain]
    runs-on: [self-hosted, windows, x64, kookie-demo-release]
    timeout-minutes: 120
    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Download pinned Kof archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-kof-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-kof
      - name: Install Java runtime for Windows PE build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "27"
      - name: Cache pinned Windows release archives
        id: windows-release-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kookie/toolchains/windows-release
          key: kookie-release-windows-${{ env.ZIG_ARCHIVE_SHA256 }}-${{ env.SDL3_ARCHIVE_SHA256 }}-${{ env.SDL3_MIXER_ARCHIVE_SHA256 }}-${{ env.MINGW_PKGCONF_ARCHIVE_SHA256 }}-${{ env.ZSTD_ARCHIVE_SHA256 }}-${{ env.MINGW_TEXT_PACKAGE_SET }}
      - name: Configure pinned Windows release tools
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          printf 'KOOKIE_BUILD_LOG_DIR=%s\n' "$runner_temp/kookie-build-logs" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_BUILD_HISTORY_DIR=%s\n' "$runner_temp/kookie-build-history" >> "$GITHUB_ENV"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          powershell_dir=/c/Windows/System32/WindowsPowerShell/v1.0
          if [[ -d "$powershell_dir" ]]; then
            export PATH="$powershell_dir:$PATH"
            printf '%s\n' "$powershell_dir" >> "$GITHUB_PATH"
          fi
          cache_dir="$HOME/.cache/kookie/toolchains/windows-release"
          mkdir -p "$cache_dir"
          ensure_zstd() {
            if [[ -n "${zstd_bin:-}" && -f "$zstd_bin" ]]; then
              return
            fi
            zstd_bin="$(command -v zstd || command -v zstd.exe || true)"
            if [[ -z "$zstd_bin" ]]; then
              for candidate in \
                '/c/Program Files/Git/usr/bin/zstd.exe' \
                '/c/Program Files/Git/usr/bin/zstd'; do
                if [[ -f "$candidate" ]]; then
                  zstd_bin="$candidate"
                  break
                fi
              done
            fi
            if [[ -z "$zstd_bin" ]]; then
              zstd_archive="$cache_dir/zstd-v${ZSTD_VERSION}-win64.zip"
              if [[ ! -f "$zstd_archive" ]]; then
                curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
                  --output "$zstd_archive" "$ZSTD_ARCHIVE_URL"
              fi
              echo "$ZSTD_ARCHIVE_SHA256  $zstd_archive" | sha256sum --check -
              zstd_install="$runner_temp/zstd-v${ZSTD_VERSION}-win64"
              rm -rf -- "$zstd_install"
              mkdir -p "$zstd_install"
              python3 - "$zstd_archive" "$zstd_install" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  target = (destination / entry.filename).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f"unsafe zstd archive entry: {entry.filename}")
              source.extractall(destination)
          PY
              zstd_bin="$zstd_install/zstd-v${ZSTD_VERSION}-win64/zstd.exe"
            fi
            test -f "$zstd_bin"
          }
          archive="$runner_temp/kookie-kof/kof-${KOF_VERSION}-linux-x86_64.tar.gz"
          checksum_file="$runner_temp/kookie-kof/SHA256SUMS"
          source_file="$runner_temp/kookie-kof/SOURCE_COMMIT"
          test -f "$archive"
          test -f "$checksum_file"
          test -f "$source_file"
          (
            cd "$(dirname "$archive")"
            sha256sum --check SHA256SUMS
          )
          [[ "$(tr -d '\r\n' <"$source_file")" == "$KOF_SOURCE_COMMIT" ]] || {
            echo 'release_demo: Kof archive source metadata disagrees with workflow pin' >&2
            exit 2
          }
          kof_root="$runner_temp/kookie-kof/kof-${KOF_VERSION}-linux-x86_64"
          tar -xzf "$archive" -C "$runner_temp/kookie-kof"
          kof_bin="$kof_root/bin"
          test -f "$kof_bin/kof"
          printf '%s\n' "$kof_bin" >> "$GITHUB_PATH"
          printf 'KOOKIE_KOF_BIN_DIR=%s\n' "$kof_bin" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE_SHA256=%s\n' \
            "$(cut -d ' ' -f 1 "$checksum_file")" >> "$GITHUB_ENV"
          printf 'KOOKIE_KOF_SOURCE_COMMIT=%s\n' "$KOF_SOURCE_COMMIT" \
            >> "$GITHUB_ENV"
          export PATH="$kof_bin:$PATH"
          [[ "$(kof version)" == "kof $KOF_VERSION" ]]

          zig_archive="$cache_dir/zig-x86_64-windows-${ZIG_VERSION}.zip"
          zig_install="$runner_temp/zig-x86_64-windows-${ZIG_VERSION}"
          if [[ ! -f "$zig_archive" ]]; then
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
              --output "$zig_archive" "$ZIG_ARCHIVE_URL"
          fi
          echo "$ZIG_ARCHIVE_SHA256  $zig_archive" | sha256sum --check -
          rm -rf -- "$zig_install"
          python3 - "$zig_archive" "$runner_temp" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  target = (destination / entry.filename).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f"unsafe Zig archive entry: {entry.filename}")
              source.extractall(destination)
          PY
          test -x "$zig_install/zig.exe"
          printf '%s\n' "$zig_install" >> "$GITHUB_PATH"
          export PATH="$zig_install:$PATH"
          [[ "$(zig version)" == "$ZIG_VERSION" ]]
          printf 'KOOKIE_ZIG_VERSION=%s\n' "$ZIG_VERSION" >> "$GITHUB_ENV"
          printf 'KOOKIE_ZIG_ARCHIVE_SHA256=%s\n' "$ZIG_ARCHIVE_SHA256" \
            >> "$GITHUB_ENV"
          sdl_root="$runner_temp/kookie-sdl"
          sdl_archive="$cache_dir/SDL3-devel-${SDL3_VERSION}-mingw.tar.gz"
          sdl_mixer_archive="$cache_dir/SDL3_mixer-devel-${SDL3_MIXER_VERSION}-mingw.tar.gz"
          if [[ ! -f "$sdl_archive" ]]; then
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
              --output "$sdl_archive" "$SDL3_ARCHIVE_URL"
          fi
          echo "$SDL3_ARCHIVE_SHA256  $sdl_archive" | sha256sum --check -
          if [[ ! -f "$sdl_mixer_archive" ]]; then
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
              --output "$sdl_mixer_archive" "$SDL3_MIXER_ARCHIVE_URL"
          fi
          echo "$SDL3_MIXER_ARCHIVE_SHA256  $sdl_mixer_archive" | sha256sum --check -
          rm -rf -- "$sdl_root"
          mkdir -p "$sdl_root"
          python3 - "$(cygpath -w "$sdl_root")" \
            "$(cygpath -w "$sdl_archive")" \
            "$(cygpath -w "$sdl_mixer_archive")" <<'PY'
          import pathlib
          import sys
          import tarfile

          destination = pathlib.Path(sys.argv[1]).resolve()
          for archive_path in sys.argv[2:]:
              with tarfile.open(archive_path, mode="r:gz") as archive:
                  for entry in archive.getmembers():
                      target = (destination / entry.name).resolve()
                      if destination not in target.parents and target != destination:
                          raise SystemExit(f"unsafe SDL archive entry: {entry.name}")
                      if entry.issym() or entry.islnk():
                          raise SystemExit(f"link in SDL archive is not allowed: {entry.name}")
          PY
          tar -xzf "$sdl_archive" -C "$sdl_root"
          tar -xzf "$sdl_mixer_archive" -C "$sdl_root"
          sdl_prefix="$sdl_root/SDL3-${SDL3_VERSION}/x86_64-w64-mingw32"
          sdl_mixer_prefix="$sdl_root/SDL3_mixer-${SDL3_MIXER_VERSION}/x86_64-w64-mingw32"
          test -f "$sdl_prefix/include/SDL3/SDL_version.h"
          test -f "$sdl_prefix/lib/libSDL3.dll.a"
          test -f "$sdl_prefix/bin/SDL3.dll"
          test -f "$sdl_mixer_prefix/include/SDL3_mixer/SDL_mixer.h"
          test -f "$sdl_mixer_prefix/lib/libSDL3_mixer.dll.a"
          test -f "$sdl_mixer_prefix/bin/SDL3_mixer.dll"
          printf 'KOOKIE_WINDOWS_SDL_PREFIX=%s\n' "$sdl_prefix" >> "$GITHUB_ENV"
          printf 'KOOKIE_WINDOWS_SDL_MIXER_PREFIX=%s\n' "$sdl_mixer_prefix" \
            >> "$GITHUB_ENV"
          printf 'KOOKIE_SDL3_ARCHIVE_SHA256=%s\n' "$SDL3_ARCHIVE_SHA256" \
            >> "$GITHUB_ENV"
          printf 'KOOKIE_SDL3_MIXER_ARCHIVE_SHA256=%s\n' \
            "$SDL3_MIXER_ARCHIVE_SHA256" >> "$GITHUB_ENV"
          mingw_candidates=(
            /mingw64 /c/msys64/mingw64 /c/msys64/clang64 /c/msys64/ucrt64
            '/c/Program Files/Git/mingw64' '/c/Program Files/msys64/mingw64'
            '/c/tools/msys64/mingw64'
          )
          pkg_config_candidates=(
            /usr /mingw64 /c/msys64/usr /c/msys64/mingw64 /c/msys64/clang64
            /c/msys64/ucrt64 '/c/Program Files/Git/usr'
            '/c/Program Files/Git/mingw64' '/c/Program Files/msys64/usr'
            '/c/Program Files/msys64/mingw64' '/c/tools/msys64/usr'
            '/c/tools/msys64/mingw64' '/c/Program Files/pkg-config'
            '/c/Program Files/pkgconf'
          )
          pkg_config_exe="$(command -v pkg-config || true)"
          if [[ -z "$pkg_config_exe" ]]; then
            pkg_config_exe="$(command -v pkgconf || true)"
          fi
          if [[ -z "$pkg_config_exe" ]]; then
            for candidate in "${pkg_config_candidates[@]}"; do
              for executable in pkg-config.exe pkg-config pkgconf.exe pkgconf; do
                if [[ -f "$candidate/bin/$executable" ]]; then
                  pkg_config_exe="$candidate/bin/$executable"
                  break 2
                fi
              done
            done
          fi
          if [[ -z "$pkg_config_exe" ]]; then
            for query in pkg-config.exe pkgconf.exe; do
              while IFS= read -r windows_candidate; do
                windows_candidate="$(cygpath -u "$windows_candidate")"
                if [[ -f "$windows_candidate" ]]; then
                  pkg_config_exe="$windows_candidate"
                  break 2
                fi
              done < <(/c/Windows/System32/where.exe "$query" 2>/dev/null |
                tr -d '\r' || true)
            done
          fi
          if [[ -z "$pkg_config_exe" ]]; then
            for search_root in \
              /c/msys64 /c/tools/msys64 '/c/Program Files/msys64' \
              '/c/Program Files/Git' /c/ProgramData/chocolatey; do
              [[ -d "$search_root" ]] || continue
              while IFS= read -r windows_candidate; do
                pkg_config_exe="$windows_candidate"
                break 2
              done < <(find "$search_root" -maxdepth 6 -type f \
                \( -iname pkg-config.exe -o -iname pkgconf.exe \) \
                -print 2>/dev/null)
            done
          fi
          if [[ -z "$pkg_config_exe" ]]; then
            pkgconf_archive="$cache_dir/mingw-w64-x86_64-pkgconf-${MINGW_PKGCONF_VERSION}-any.pkg.tar.zst"
            if [[ ! -f "$pkgconf_archive" ]]; then
              curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
                --output "$pkgconf_archive" "$MINGW_PKGCONF_ARCHIVE_URL"
            fi
            echo "$MINGW_PKGCONF_ARCHIVE_SHA256  $pkgconf_archive" |
              sha256sum --check -
            pkgconf_root="$runner_temp/kookie-pkgconf"
            rm -rf -- "$pkgconf_root"
            mkdir -p "$pkgconf_root"
            if tar --help 2>/dev/null | grep -q -- '--zstd' &&
               tar --zstd -xf "$pkgconf_archive" -C "$pkgconf_root"; then
              :
            else
              rm -rf -- "$pkgconf_root"
              mkdir -p "$pkgconf_root"
              ensure_zstd
              "$zstd_bin" -q -d -c "$pkgconf_archive" |
                tar -xf - -C "$pkgconf_root"
            fi
            pkg_config_exe="$pkgconf_root/mingw64/bin/pkgconf.exe"
          fi
          [[ -n "$pkg_config_exe" && -f "$pkg_config_exe" ]] || {
            echo 'release_demo: pkg-config or pkgconf is required on the Windows release runner' >&2
            exit 2
          }
          pkg_config_dir="$(dirname "$pkg_config_exe")"
          if [[ "$(basename "$pkg_config_exe")" == pkgconf* ]]; then
            pkg_config_shim="$runner_temp/kookie-pkg-config"
            mkdir -p "$pkg_config_shim"
            printf '#!/usr/bin/env bash\nexec %q "$@"\n' \
              "$pkg_config_exe" > "$pkg_config_shim/pkg-config"
            chmod +x "$pkg_config_shim/pkg-config"
            export PATH="$pkg_config_shim:$pkg_config_dir:$PATH"
            printf '%s\n' "$pkg_config_shim" >> "$GITHUB_PATH"
          else
            export PATH="$pkg_config_dir:$PATH"
            printf '%s\n' "$pkg_config_dir" >> "$GITHUB_PATH"
          fi
          command -v pkg-config >/dev/null || {
            echo 'release_demo: pkg-config is required on the Windows release runner' >&2
            exit 2
          }
          mingw_text_root="$runner_temp/kookie-mingw-text"
          ensure_zstd
          rm -rf -- "$mingw_text_root"
          mkdir -p "$mingw_text_root"
          while IFS='|' read -r package_archive package_sha256; do
            [[ -n "$package_archive" ]] || continue
            package_path="$cache_dir/$package_archive"
            if [[ ! -f "$package_path" ]]; then
              curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
                --output "$package_path" \
                "$MINGW_TEXT_PACKAGE_BASE_URL/$package_archive"
            fi
            echo "$package_sha256  $package_path" | sha256sum --check -
            "$zstd_bin" -q -d -c "$package_path" |
              tar -xf - -C "$mingw_text_root"
          done <<<"$MINGW_TEXT_PACKAGE_MANIFEST"
          mingw_text_prefix="$mingw_text_root/mingw64"
          test -f "$mingw_text_prefix/include/freetype2/ft2build.h"
          test -f "$mingw_text_prefix/include/harfbuzz/hb-ft.h"
          test -f "$mingw_text_prefix/lib/libfreetype.dll.a"
          test -f "$mingw_text_prefix/lib/libharfbuzz.dll.a"
          test -f "$mingw_text_prefix/lib/pkgconfig/freetype2.pc"
          test -f "$mingw_text_prefix/lib/pkgconfig/harfbuzz.pc"
          mingw_candidates=("$mingw_text_prefix" "${mingw_candidates[@]}")
          pkg_config_paths=(
            "$sdl_prefix/lib/pkgconfig"
            "$sdl_mixer_prefix/lib/pkgconfig"
          )
          for candidate in "${mingw_candidates[@]}"; do
            if [[ -d "$candidate/lib/pkgconfig" ]]; then
              pkg_config_paths+=("$candidate/lib/pkgconfig")
            fi
          done
          if ((${#pkg_config_paths[@]})); then
            joined_pkg_config_path="$(IFS=:; printf '%s' "${pkg_config_paths[*]}")"
            export PKG_CONFIG_PATH="$joined_pkg_config_path${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            printf 'PKG_CONFIG_PATH=%s\n' "$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          fi
          freetype_pkg_prefix="$(pkg-config --variable=prefix freetype2 2>/dev/null || true)"
          harfbuzz_pkg_prefix="$(pkg-config --variable=prefix harfbuzz 2>/dev/null || true)"
          for prefix_variable in freetype_pkg_prefix harfbuzz_pkg_prefix; do
            prefix_value="${!prefix_variable}"
            if [[ -n "$prefix_value" ]]; then
              prefix_value="$(cygpath -u "$prefix_value" 2>/dev/null || printf '%s' "$prefix_value")"
              printf -v "$prefix_variable" '%s' "$prefix_value"
            fi
          done
          freetype_prefix="${KOOKIE_WINDOWS_FREETYPE_PREFIX:-$freetype_pkg_prefix}"
          harfbuzz_prefix="${KOOKIE_WINDOWS_HARFBUZZ_PREFIX:-$harfbuzz_pkg_prefix}"
          for candidate in "${mingw_candidates[@]}"; do
            if [[ ! -f "$freetype_prefix/lib/pkgconfig/freetype2.pc" &&
                  -f "$candidate/lib/pkgconfig/freetype2.pc" ]]; then
              freetype_prefix="$candidate"
            fi
            if [[ ! -f "$harfbuzz_prefix/lib/pkgconfig/harfbuzz.pc" &&
                  -f "$candidate/lib/pkgconfig/harfbuzz.pc" ]]; then
              harfbuzz_prefix="$candidate"
            fi
          done
          [[ -f "$freetype_prefix/lib/pkgconfig/freetype2.pc" ]] || {
            echo 'release_demo: unable to resolve a MinGW FreeType prefix from pkg-config or the runner' >&2
            exit 2
          }
          [[ -f "$harfbuzz_prefix/lib/pkgconfig/harfbuzz.pc" ]] || {
            echo 'release_demo: unable to resolve a MinGW HarfBuzz prefix from pkg-config or the runner' >&2
            exit 2
          }
          printf 'KOOKIE_WINDOWS_FREETYPE_PREFIX=%s\n' "$freetype_prefix" >> "$GITHUB_ENV"
          printf 'KOOKIE_WINDOWS_HARFBUZZ_PREFIX=%s\n' "$harfbuzz_prefix" >> "$GITHUB_ENV"
          dxc="${KOOKIE_DXC:-}"
          if [[ "$dxc" == [A-Za-z]:* ]]; then
            dxc="$(cygpath -u "$dxc")"
          fi
          if [[ -n "$dxc" && ! -f "$dxc" ]]; then
            dxc=
          fi
          if [[ -z "$dxc" ]]; then
            dxc="$(command -v dxc || true)"
          fi
          if [[ -z "$dxc" ]]; then
            for candidate in \
              '/c/Program Files/LLVM/bin/dxc.exe' \
              '/c/Program Files/DirectXShaderCompiler/bin/x64/dxc.exe' \
              '/c/Program Files/DirectX Shader Compiler/bin/x64/dxc.exe' \
              '/c/Program Files/DXC/bin/x64/dxc.exe' \
              '/c/Program Files (x86)/Windows Kits/10/bin/'*/x64/dxc.exe \
              '/c/Program Files/Windows Kits/10/bin/'*/x64/dxc.exe \
              /c/Windows/Microsoft.NET/Framework64/*/dxc.exe; do
              if [[ -f "$candidate" ]]; then
                dxc="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$dxc" ]]; then
            while IFS= read -r windows_candidate; do
              windows_candidate="$(cygpath -u "$windows_candidate")"
              if [[ -f "$windows_candidate" ]]; then
                dxc="$windows_candidate"
                break
              fi
            done < <(/c/Windows/System32/where.exe dxc.exe 2>/dev/null |
              tr -d '\r' || true)
          fi
          [[ -n "$dxc" && -f "$dxc" ]] || {
            echo 'release_demo: unable to resolve dxc from KOOKIE_DXC, PATH, or known runner locations' >&2
            exit 2
          }
          printf 'KOOKIE_DXC=%s\n' "$dxc" >> "$GITHUB_ENV"


          wrapper="$workspace/scripts/windows_isolated_display"
          test -x "$wrapper"
          printf '%s\n' "$workspace/scripts" >> "$GITHUB_PATH"
          printf 'KOOKIE_WINDOWS_PRESENTATION_ISOLATION_WRAPPER=%s\n' \
            "$wrapper" >> "$GITHUB_ENV"
          if [[ "${{ inputs.run_windows_presentation_smoke }}" == true ]]; then
            powershell_path=/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
            gpu_json="$runner_temp/kookie-gpu.json"
            "$powershell_path" -NoLogo -NoProfile -NonInteractive -Command \
              '$ErrorActionPreference="Stop"; $gpu=Get-CimInstance Win32_VideoController | Where-Object { $_.PNPDeviceID -like "PCI*" } | Select-Object -First 1 Name,DriverVersion,PNPDeviceID; if ($null -eq $gpu) { throw "no PCI display adapter found" }; $gpu | ConvertTo-Json -Compress' \
              >"$gpu_json"
            mapfile -t gpu_identity < <(python3 - "$gpu_json" <<'PY'
          import json
          import pathlib
          import sys

          gpu = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("PNPDeviceID", "Name", "DriverVersion"):
              value = gpu.get(key)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"missing Windows GPU field: {key}")
              print(value.replace("\r", " ").replace("\n", " ").strip())
          PY
            )
            [[ "${#gpu_identity[@]}" == 3 ]]
            printf 'KOOKIE_PRESENTATION_HARDWARE_ID=%s\n' "${gpu_identity[0]}" \
              >> "$GITHUB_ENV"
            printf 'KOOKIE_PRESENTATION_GPU_DRIVER=%s %s\n' \
              "${gpu_identity[1]}" "${gpu_identity[2]}" >> "$GITHUB_ENV"
            printf 'Windows presentation target: %s (%s)\n' \
              "${gpu_identity[1]}" "${gpu_identity[2]}"
          fi
      - name: Record Windows release cache result
        shell: bash
        run: |
          printf '%s\n' '- Windows release archive cache hit: `${{ steps.windows-release-cache.outputs.cache-hit || false }}`' >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight Windows presentation capability
        if: ${{ inputs.run_windows_presentation_smoke || inputs.run_windows_wine_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.run_windows_presentation_smoke }}" == true ]]; then
            wrapper="${KOOKIE_WINDOWS_PRESENTATION_ISOLATION_WRAPPER:-}"
            [[ -n "$wrapper" ]] && command -v "$wrapper" >/dev/null || {
              echo 'release_demo: native Windows presentation smoke requires KOOKIE_WINDOWS_PRESENTATION_ISOLATION_WRAPPER' >&2
              exit 75
            }
            : "${KOOKIE_PRESENTATION_HARDWARE_ID:?set a stable target hardware identifier on the runner}"
            : "${KOOKIE_PRESENTATION_GPU_DRIVER:?set the target GPU driver identity on the runner}"

            runtime_log="$RUNNER_TEMP/kookie-windows-isolated-runtime.log"
            runtime_script="$RUNNER_TEMP/kookie-windows-isolated-runtime.cmd"
            runtime_script_path="$(cygpath -w "$runtime_script")"
            runtime_log_path="$(cygpath -w "$runtime_log")"
            runtime_host_log="$RUNNER_TEMP/kookie-windows-isolated-runtime-host.log"
            {
              printf '%s\r\n' '@echo off'
              printf 'echo KOOKIE Windows isolated runtime preflight > "%s"\r\n' \
                "$runtime_log_path"
              printf '%s\r\n' 'exit /b 0'
            } >"$runtime_script"
            set +e
            KOOKIE_WINDOWS_COMMAND='C:\Windows\System32\cmd.exe' "$wrapper" \
              --timeout 30 -- /c "$runtime_script_path" \
              >"$runtime_host_log" 2>&1
            runtime_status=$?
            set -e
            cat "$runtime_host_log"
            if [[ ! -f "$runtime_log" ]]; then
              echo 'release_demo: isolated Windows batch preflight did not create its output' >&2
              cat "$runtime_script"
              exit 1
            fi
            cat "$runtime_log"
            if [[ "$runtime_status" != 0 ]]; then
              echo "release_demo: isolated Windows runtime probe failed with status $runtime_status" >&2
              exit "$runtime_status"
            fi
          fi
          if [[ "${{ inputs.run_windows_wine_smoke }}" == true ]]; then
            command -v wine >/dev/null || {
              echo 'release_demo: Wine smoke requires wine' >&2
              exit 2
            }
            command -v overzeer-isolated-display >/dev/null || {
              echo 'release_demo: Wine smoke requires overzeer-isolated-display' >&2
              exit 2
            }
          fi


      - name: Prepare release identity
        shell: bash
        env:
          KOOKIE_SIGNING_KEY_PEM: ${{ secrets.KOOKIE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          : "${KOOKIE_SIGNING_KEY_PEM:?KOOKIE_SIGNING_KEY_PEM is required}"
          source scripts/kof_pin.sh
          [[ "$KOOKIE_KOF_SOURCE_COMMIT" == "$KOF_PIN_SOURCE_COMMIT" ]] || {
            echo 'release_demo: workflow Kof source pin disagrees with scripts/kof_pin.sh' >&2
            exit 2
          }
          : "${KOOKIE_KOF_ARCHIVE_SHA256:?KOOKIE_KOF_ARCHIVE_SHA256 is required}"
          : "${KOOKIE_KOF_SOURCE_COMMIT:?Kof source commit is required}"
          : "${KOOKIE_KOF_ARCHIVE:?configure KOOKIE_KOF_ARCHIVE on this release runner}"
          [[ -f "$KOOKIE_KOF_ARCHIVE" && ! -L "$KOOKIE_KOF_ARCHIVE" ]] || {
            echo 'release_demo: KOOKIE_KOF_ARCHIVE must be a regular file' >&2
            exit 2
          }
          actual_kof_archive_sha256="$(sha256sum "$KOOKIE_KOF_ARCHIVE" | cut -d ' ' -f 1)"
          [[ "$actual_kof_archive_sha256" == "${KOOKIE_KOF_ARCHIVE_SHA256,,}" ]] || {
            echo 'release_demo: installed Kof archive does not match KOOKIE_KOF_ARCHIVE_SHA256' >&2
            exit 2
          }
          : "${KOOKIE_WINDOWS_SDL_PREFIX:?configure KOOKIE_WINDOWS_SDL_PREFIX on this runner}"
          : "${KOOKIE_WINDOWS_SDL_MIXER_PREFIX:?configure KOOKIE_WINDOWS_SDL_MIXER_PREFIX on this runner}"
          : "${KOOKIE_WINDOWS_FREETYPE_PREFIX:?configure KOOKIE_WINDOWS_FREETYPE_PREFIX on this runner}"
          : "${KOOKIE_WINDOWS_HARFBUZZ_PREFIX:?configure KOOKIE_WINDOWS_HARFBUZZ_PREFIX on this runner}"
          : "${KOOKIE_DXC:?configure KOOKIE_DXC on this runner}"
          command -v pkg-config >/dev/null
          test -f "$KOOKIE_WINDOWS_FREETYPE_PREFIX/lib/pkgconfig/freetype2.pc"
          test -f "$KOOKIE_WINDOWS_HARFBUZZ_PREFIX/lib/pkgconfig/harfbuzz.pc"
          test -f "$KOOKIE_WINDOWS_FREETYPE_PREFIX/include/freetype2/ft2build.h" ||
            test -f "$KOOKIE_WINDOWS_FREETYPE_PREFIX/include/ft2build.h"
          test -f "$KOOKIE_WINDOWS_FREETYPE_PREFIX/lib/libfreetype.dll.a"
          test -f "$KOOKIE_WINDOWS_FREETYPE_PREFIX/bin/libfreetype-6.dll"
          test -f "$KOOKIE_WINDOWS_HARFBUZZ_PREFIX/include/harfbuzz/hb-ft.h"
          test -f "$KOOKIE_WINDOWS_HARFBUZZ_PREFIX/lib/libharfbuzz.dll.a"
          test -f "$KOOKIE_WINDOWS_HARFBUZZ_PREFIX/bin/libharfbuzz-0.dll"
          printf '%s\n' "$KOOKIE_SIGNING_KEY_PEM" >"$RUNNER_TEMP/kookie-signing.pem"
          chmod 600 "$RUNNER_TEMP/kookie-signing.pem"
          printf 'KOOKIE_SIGNING_KEY=%s\n' "$RUNNER_TEMP/kookie-signing.pem" >>"$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE_SHA256=%s\n' "$KOOKIE_KOF_ARCHIVE_SHA256" >>"$GITHUB_ENV"
          printf 'KOOKIE_KOF_ARCHIVE=%s\n' "$KOOKIE_KOF_ARCHIVE" >>"$GITHUB_ENV"
          actual_kof_version="$(kof version)"
          [[ "$actual_kof_version" == "$KOF_PIN_CLI_VERSION" ]] || {
            printf 'release_demo: expected %s; found %s\n' "$KOF_PIN_CLI_VERSION" "$actual_kof_version" >&2
            exit 2
          }
          zig version
          "$KOOKIE_DXC" --version
      - name: Preflight Windows release runner
        shell: bash
        run: bash scripts/runner_preflight.sh release-windows

      - name: Build deterministic Windows artifact
        shell: bash
        env:
          DEMO_VERSION: ${{ inputs.version }}
          KOOKIE_CONTENT_PROFILE: none
        run: |
          set -euo pipefail
          bash scripts/ci_timed.sh windows-release \
            scripts/build_demo_release.sh \
            --target windows-x86_64 \
            --version "$DEMO_VERSION" \
            --output "$RUNNER_TEMP/kookie-demo-windows"

      - name: Run Windows artifact gate
        shell: bash
        env:
          DEMO_VERSION: ${{ inputs.version }}
          KOOKIE_PACKAGE_DIR: ${{ runner.temp }}/kookie-demo-windows
          KOOKIE_PACKAGE_NAME: kookie-${{ inputs.version }}-windows-x86_64
          KOOKIE_RUN_WINE: ${{ inputs.run_windows_wine_smoke && '1' || '0' }}
          KOOKIE_RUN_NATIVE_PRESENTATION: ${{ inputs.run_windows_presentation_smoke && '1' || '0' }}
          KOOKIE_PRESENTATION_EVIDENCE_DIR: ${{ runner.temp }}/kookie-d1-evidence-windows
        run: |
          set -euo pipefail
          bash scripts/ci_timed.sh windows-presentation \
            scripts/verify_windows_presentation.sh

      - name: Upload Windows artifact set
        if: ${{ always() && inputs.run_windows_presentation_smoke }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-demo-windows-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-demo-windows
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows presentation evidence
        if: ${{ always() && inputs.run_windows_presentation_smoke }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-d1-presentation-evidence-windows-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-d1-evidence-windows
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Kof build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-kof-build-diagnostics-windows-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-build-logs
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish approved Linux/Windows pair
    if: ${{ inputs.publish }}
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: kookie-demo-release
    permissions:
      contents: write
    steps:
      - name: Require target hardware evidence for publication
        shell: bash
        env:
          RUN_LINUX_PRESENTATION_SMOKE: ${{ inputs.run_linux_presentation_smoke }}
          RUN_WINDOWS_PRESENTATION_SMOKE: ${{ inputs.run_windows_presentation_smoke }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$RUN_LINUX_PRESENTATION_SMOKE" == true ]] || {
            echo 'release_demo: publish requires run_linux_presentation_smoke=true' >&2
            exit 2
          }
          [[ "$RUN_WINDOWS_PRESENTATION_SMOKE" == true ]] || {
            echo 'release_demo: publish requires run_windows_presentation_smoke=true' >&2
            exit 2
          }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_demo: publish requires source_commit as a 40-character lowercase commit SHA' >&2
            exit 2
          }

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Download Linux artifact set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-demo-linux-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-demo-linux

      - name: Download Windows artifact set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-demo-windows-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-demo-windows

      - name: Download Linux presentation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-d1-presentation-evidence-linux-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-d1-evidence-linux

      - name: Download Windows presentation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kookie-d1-presentation-evidence-windows-${{ inputs.version }}
          path: ${{ runner.temp }}/kookie-d1-evidence-windows

      - name: Assemble paired checksums and qualification manifest
        shell: bash
        env:
          KOOKIE_SIGNING_KEY_PEM: ${{ secrets.KOOKIE_SIGNING_KEY_PEM }}
          DEMO_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          : "${KOOKIE_SIGNING_KEY_PEM:?KOOKIE_SIGNING_KEY_PEM is required}"
          command -v gh >/dev/null
          publish_dir="$RUNNER_TEMP/kookie-demo-publish"
          package_stage="$RUNNER_TEMP/kookie-demo-package-qualification"
          mkdir -p "$publish_dir" "$package_stage"
          for target in linux windows; do
            source_dir="$RUNNER_TEMP/kookie-demo-$target"
            target_stage="$package_stage/$target"
            mkdir -p "$target_stage"
            find "$source_dir" -maxdepth 1 -type f \
              ! -name 'BUILD_SUMMARY.txt' \
              ! -name 'QUALIFICATION_MANIFEST.json' -exec cp -- {} "$target_stage/" \;
            find "$source_dir" -maxdepth 1 -type f \
              ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.sig' \
              ! -name 'BUILD_SUMMARY.txt' \
              ! -name 'QUALIFICATION_MANIFEST.json' -exec cp -- {} "$publish_dir/" \;
            cp -- "$source_dir/BUILD_SUMMARY.txt" \
              "$publish_dir/BUILD_SUMMARY-$target.txt"
          done
          signing_key="$RUNNER_TEMP/kookie-signing.pem"
          printf '%s\n' "$KOOKIE_SIGNING_KEY_PEM" >"$signing_key"
          chmod 600 "$signing_key"
          trusted_public_key="$publish_dir/release-public-key.pem"
          openssl pkey -in "$signing_key" -pubout -out "$trusted_public_key"
          chmod 644 "$trusted_public_key"
          python3 scripts/build_release_qualification.py \
            "$publish_dir/RELEASE_QUALIFICATION.json" \
            --trusted-public-key "$trusted_public_key" \
            --expected-source-commit "$SOURCE_COMMIT" \
            --package-manifest "linux-x86_64=$package_stage/linux/kookie-${DEMO_VERSION}-linux-x86_64.json" \
            --package-manifest "windows-x86_64=$package_stage/windows/kookie-${DEMO_VERSION}-windows-x86_64.json" \
            --evidence "linux-x86_64=$RUNNER_TEMP/kookie-d1-evidence-linux/evidence.json" \
            --evidence "windows-x86_64=$RUNNER_TEMP/kookie-d1-evidence-windows/evidence.json" \
            --require-hardware
          openssl pkeyutl -sign -rawin -inkey "$signing_key" \
            -in "$publish_dir/RELEASE_QUALIFICATION.json" \
            -out "$publish_dir/RELEASE_QUALIFICATION.json.sig"
          mapfile -t assets < <(
            cd "$publish_dir"
            printf '%s\n' kookie-* RELEASE_QUALIFICATION.json \
              RELEASE_QUALIFICATION.json.sig | sort
          )
          (cd "$publish_dir" && sha256sum "${assets[@]}" > SHA256SUMS)
          (cd "$publish_dir" && sha256sum --check SHA256SUMS >/dev/null)
          openssl pkeyutl -sign -rawin -inkey "$signing_key" \
            -in "$publish_dir/SHA256SUMS" -out "$publish_dir/SHA256SUMS.sig"
          public_key="$trusted_public_key"
          openssl pkeyutl -verify -rawin -pubin -inkey "$public_key" \
            -in "$publish_dir/RELEASE_QUALIFICATION.json" \
            -sigfile "$publish_dir/RELEASE_QUALIFICATION.json.sig" >/dev/null
          openssl pkeyutl -verify -rawin -pubin -inkey "$public_key" \
            -in "$publish_dir/SHA256SUMS" \
            -sigfile "$publish_dir/SHA256SUMS.sig" >/dev/null
          source_commit="$SOURCE_COMMIT"
          cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          # KOOKIE $DEMO_VERSION

          Signed native presentation packages built from source commit
          \`$source_commit\` with Kof source commit
          \`${KOOKIE_KOF_SOURCE_COMMIT:-a14a7cd47d74192dcc977c9d4cbf87d407694560}\`.

          This bounded first demo contains local \`Play\`, fixed two-player
          \`Host/Join\`, explicit \`READY\` gating and the host-authoritative
          \`Tab\` player screen. Networking remains direct-IPv4 dogfood with no
          relay, public identity service or production DDoS protection.

          Verify \`SHA256SUMS\` and \`SHA256SUMS.sig\` before extraction.
          \`RELEASE_QUALIFICATION.json\` is the canonical paired artifact and
          records the target-specific hardware evidence required for publication.
          EOF
          printf 'KOOKIE paired release assets prepared in %s\n' "$publish_dir"

      - name: Create GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          gh release create "$DEMO_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --prerelease \
            --title "KOOKIE $DEMO_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$DEMO_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/kookie-demo-publish"/* \
            --clobber
