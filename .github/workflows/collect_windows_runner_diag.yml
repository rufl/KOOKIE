name: Collect Windows runner diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Collect NetworkService diagnostic
    runs-on: [self-hosted, windows, x64, kookie-demo-release]
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Run NetworkService diagnostic
        shell: bash
        run: |
          set -euo pipefail
          powershell_path=/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
          script_path="$RUNNER_TEMP/kookie-networkservice-diag.ps1"
          script_path_win="$(cygpath -w "$script_path")"
          cat >"$script_path" <<'POWERSHELL'
          $ErrorActionPreference = 'Continue'
          $repo = $env:GITHUB_WORKSPACE
          $wrapper = Join-Path $repo 'scripts\windows_isolated_display.ps1'
          $ps = Join-Path $PSHOME 'powershell.exe'
          $diag = Join-Path $env:RUNNER_TEMP 'kookie-networkservice-diag'
          Remove-Item -LiteralPath $diag -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $summary = Join-Path $diag 'summary.txt'
          Start-Transcript -Path $summary -Force | Out-Null
          try {
              Write-Host "identity: $([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
              Write-Host "session: $((Get-Process -Id $PID).SessionId)"
              Write-Host "repo: $repo"
              Write-Host "wrapper: $wrapper"
              Write-Host "powershell: $ps"
              $cmd = Join-Path $env:SystemRoot 'System32\cmd.exe'
              $bashCandidates = @(
                  (Join-Path $env:ProgramFiles 'Git\usr\bin\bash.exe'),
                  (Join-Path $env:ProgramFiles 'Git\bin\bash.exe')
              )
              $bash = $bashCandidates |
                  Where-Object { Test-Path -LiteralPath $_ } |
                  Select-Object -First 1
              Write-Host "cmd: $cmd"
              Write-Host "bash: $bash"
              $cmdProbe = Join-Path $diag 'cmd-probe.cmd'
              $cmdProbeOutput = Join-Path $diag 'cmd-probe.out'
              @"
          @echo off
          echo KOOKIE_CMD_PROBE_OK > "$cmdProbeOutput"
          exit /b 0
          "@ | Set-Content -LiteralPath $cmdProbe -Encoding ASCII
              function Invoke-IsolatedProbe {
                  param(
                      [string]$Name,
                      [string]$Executable,
                      [bool]$NoStdHandles,
                      [string[]]$ChildArguments
                  )
                  $log = Join-Path $diag "$Name.log"
                  $env:KOOKIE_WINDOWS_BASH = $Executable
                  $env:KOOKIE_WINDOWS_ISOLATED_DEBUG = '1'
                  if ($NoStdHandles) {
                      $env:KOOKIE_WINDOWS_ISOLATED_NO_STD_HANDLES = '1'
                  } else {
                      Remove-Item Env:KOOKIE_WINDOWS_ISOLATED_NO_STD_HANDLES `
                          -ErrorAction SilentlyContinue
                  }
                  $invokeArgs = @(
                      '-NoLogo', '-NoProfile', '-NonInteractive',
                      '-ExecutionPolicy', 'Bypass', '-File', $wrapper,
                      '--timeout', '30', '--'
                  ) + $ChildArguments
                  & $ps @invokeArgs > $log 2>&1
                  $status = $LASTEXITCODE
                  Write-Host ("`n=== {0}: status={1} ===" -f $Name, $status)
                  if (Test-Path -LiteralPath $log) {
                      Get-Content -LiteralPath $log
                  }
                  [pscustomobject]@{
                      Name = $Name
                      Status = $status
                      Log = $log
                  }
              }
              $results = @()
              if ($bash) {
                  $results += Invoke-IsolatedProbe `
                      -Name 'bash-no-std' -Executable $bash `
                      -NoStdHandles $true -ChildArguments @('-c', 'exit 0')
                  $results += Invoke-IsolatedProbe `
                      -Name 'bash-with-std' -Executable $bash `
                      -NoStdHandles $false -ChildArguments @('-c', 'exit 0')
              }
              $results += Invoke-IsolatedProbe `
                  -Name 'cmd-no-std' -Executable $cmd `
                  -NoStdHandles $true `
                  -ChildArguments @('/c', 'call', $cmdProbe)
              $results += Invoke-IsolatedProbe `
                  -Name 'cmd-with-std' -Executable $cmd `
                  -NoStdHandles $false `
                  -ChildArguments @('/c', 'call', $cmdProbe)
              if ($bash) {
                  & $bash --noprofile --norc -c 'exit 0'
                  Write-Host "direct-bash-status=$LASTEXITCODE"
              }
              & $cmd /c exit 0
              Write-Host "direct-cmd-status=$LASTEXITCODE"
              Write-Host "cmd-probe-output-exists=$(Test-Path -LiteralPath $cmdProbeOutput)"
              if (Test-Path -LiteralPath $cmdProbeOutput) {
                  Get-Content -LiteralPath $cmdProbeOutput
              }
              $results | Format-Table -AutoSize
          } finally {
              Stop-Transcript | Out-Null
          }
          POWERSHELL
          "$powershell_path" -NoLogo -NoProfile -NonInteractive \
              -ExecutionPolicy Bypass -File "$script_path_win"
      - name: Upload diagnostic files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kookie-networkservice-diag
          path: C:\Windows\Temp\kookie-collected
          if-no-files-found: error
          retention-days: 2
