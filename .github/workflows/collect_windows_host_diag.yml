name: Collect Windows host diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: [self-hosted, windows, x64, kookie-demo-release]
    timeout-minutes: 5
    steps:
      - name: Collect host facts
        shell: bash
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/kookie-windows-host-diagnostics.ps1"
          cat >"$script" <<'POWERSHELL'
          $ErrorActionPreference = 'Continue'
          $output = Join-Path $env:RUNNER_TEMP 'kookie-windows-host-diagnostics.txt'
          @(
            "identity=$(whoami)"
            "computer=$env:COMPUTERNAME"
            "session=$env:SESSIONNAME"
            "userdomain=$env:USERDOMAIN"
            "username=$env:USERNAME"
            "--- query session ---"
            (query session 2>&1 | Out-String).TrimEnd()
            "--- whoami privileges ---"
            (whoami /all 2>&1 | Out-String).TrimEnd()
            "--- interactive processes ---"
            (Get-CimInstance Win32_Process | Where-Object { $_.Name -in @('explorer.exe', 'dwm.exe', 'winlogon.exe') } | Select-Object Name,ProcessId,SessionId,ExecutablePath | Format-Table -AutoSize | Out-String).TrimEnd()
            "--- runner service ---"
            (Get-CimInstance Win32_Service | Where-Object { $_.Name -match 'actions|runner|kookie' } | Select-Object Name,State,StartName,PathName | Format-List | Out-String).TrimEnd()
            "--- candidate launch tools ---"
            ((Get-Command psexec,psexesvc,tscon,runas,schtasks -ErrorAction SilentlyContinue | Select-Object Name,Source | Format-Table -AutoSize | Out-String).TrimEnd())
          ) | Set-Content -LiteralPath $output -Encoding utf8
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class KookieWindowsSessionProbe {
              [DllImport("kernel32.dll")] public static extern uint WTSGetActiveConsoleSessionId();
              [DllImport("wtsapi32.dll", SetLastError=true)] public static extern bool WTSQueryUserToken(uint sessionId, out IntPtr token);
              [DllImport("kernel32.dll", SetLastError=true)] public static extern bool CloseHandle(IntPtr handle);
          }
          '@
          $session = [KookieWindowsSessionProbe]::WTSGetActiveConsoleSessionId()
          $token = [IntPtr]::Zero
          $tokenOk = [KookieWindowsSessionProbe]::WTSQueryUserToken($session, [ref]$token)
          Add-Content -LiteralPath $output -Value "active_console_session=$session"
          Add-Content -LiteralPath $output -Value "wts_query_user_token=$tokenOk last_error=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          if ($tokenOk -and $token -ne [IntPtr]::Zero) {
              [KookieWindowsSessionProbe]::CloseHandle($token) | Out-Null
          }
          Get-Content -LiteralPath $output
          POWERSHELL
          /c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "$(cygpath -w "$script")"
      - name: Upload host diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: kookie-windows-host-diagnostics
          path: ${{ runner.temp }}/kookie-windows-host-diagnostics.txt
          if-no-files-found: error
          retention-days: 1
