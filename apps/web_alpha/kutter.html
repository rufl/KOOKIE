<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b16">
  <title>Kutter — GatoGanso Editor</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101b16; color: #f5f4e8; }
    * { box-sizing: border-box; }
    html, body, #kutter-app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #101b16; }
    button, input, select { font: inherit; }
    button { min-height: 42px; border: 1px solid #596a52; border-radius: 9px; background: #1a2920; color: #f3f2e6; padding: 7px 10px; font-weight: 650; cursor: pointer; touch-action: manipulation; }
    button:hover:not(:disabled), button[aria-pressed="true"] { border-color: #f4d26d; background: #35452f; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select { min-width: 0; min-height: 40px; border: 1px solid #455747; border-radius: 7px; padding: 6px 8px; background: #0d1612; color: #fff; }
    :focus-visible { outline: 3px solid #f4d26d; outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    #kutter-app { display: grid; grid-template-rows: 58px minmax(0,1fr) 46px; }
    .topbar { display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid #36463a; background: #131f19; }
    .brand { color: #f4d26d; font-weight: 800; letter-spacing: .1em; }
    .subbrand { color: #9eae99; font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .top-actions a { color: #dce8cc; font-size: 13px; }
    .top-actions a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 6px; }
    #kutter-app:fullscreen, #kutter-app:-webkit-full-screen { width: 100vw; height: 100dvh; }
    #connection-state { color: #d8c878; font: 12px ui-monospace, monospace; }
    .workspace { display: grid; min-height: 0; grid-template-columns: 188px minmax(0,1fr) 310px; gap: 1px; background: #334339; }
    .panel { min-width: 0; min-height: 0; background: #142019; }
    .tool-panel { display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow: auto; }
    .panel-title { color: #bdc9ae; font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .tool-panel button { width: 100%; text-align: left; }
    .tool-panel button small { display: block; color: #93a28d; font-size: 10px; font-weight: 400; }
    .viewport-panel { position: relative; overflow: hidden; background: #07100d; }
    #kutter-viewport { display: block; width: 100%; height: 100%; touch-action: none; }
    .viewport-info { position: absolute; top: 12px; left: 12px; z-index: 2; padding: 8px 10px; border: 1px solid #ffffff27; border-radius: 8px; background: #101b16da; color: #dce8cc; font: 11px ui-monospace, monospace; pointer-events: none; }
    .viewport-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); padding: 7px 10px; border-radius: 8px; background: #101b16d9; color: #c5d0b9; font-size: 11px; pointer-events: none; }
    .inspector { display: grid; grid-template-rows: minmax(120px, 38%) minmax(0,1fr); overflow: hidden; }
    .hierarchy { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-bottom: 1px solid #35463a; min-height: 0; }
    #node-list { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
    .node-row { display: flex; justify-content: space-between; align-items: center; min-height: 36px; padding: 4px 8px; border: 1px solid transparent; border-radius: 7px; color: #dce8cc; font: 12px ui-monospace, monospace; cursor: pointer; }
    .node-row[aria-current="true"] { border-color: #d8bf69; background: #35452f; }
    .node-row[data-multi="true"]::after { content: "GROUP"; color: #f4d26d; font-size: 9px; }
    .inspector-form { display: flex; flex-direction: column; gap: 9px; overflow: auto; padding: 12px; }
    .inspector-form label { display: grid; grid-template-columns: 64px minmax(0,1fr); align-items: center; gap: 8px; color: #b9c5b2; font-size: 11px; }
    .xyz { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
    .xyz label { grid-template-columns: 18px minmax(0,1fr); }
    .row-actions { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; }
    .row-actions button { min-height: 38px; font-size: 11px; }
    #node-color { height: 42px; padding: 3px; }
    #asset-token { width: 100%; }
    #validation { min-height: 35px; padding: 8px; border-radius: 7px; background: #1a2a20; color: #cbd7c1; font-size: 11px; }
    .bottombar { display: flex; align-items: center; gap: 10px; padding: 4px 12px; border-top: 1px solid #35463a; background: #131f19; }
    #editor-message { overflow: hidden; color: #b8c8b4; font: 11px ui-monospace, monospace; text-overflow: ellipsis; white-space: nowrap; }
    #document-meta { margin-left: auto; color: #99a894; font: 10px ui-monospace, monospace; }
    @media (max-width: 860px) {
      #kutter-app { min-width: 0; height: 100dvh; grid-template-rows: calc(56px + env(safe-area-inset-top)) minmax(0,1fr) calc(48px + env(safe-area-inset-bottom)); }
      .topbar { min-width: 0; width: 100%; gap: 6px; padding: env(safe-area-inset-top) 8px 0; }
      .top-actions { min-width: 0; flex: 1 1 auto; justify-content: flex-end; gap: 4px; overflow: hidden; }
      .top-actions button, .top-actions a { flex: 0 0 auto; min-width: 44px; min-height: 44px; }
      .bottombar { min-width: 0; padding-bottom: max(2px, env(safe-area-inset-bottom)); }
      #editor-message { min-width: 0; flex: 1 1 auto; }
      .brand { flex: 0 0 auto; }
      .subbrand { display: none; }
      .workspace { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(250px,1.08fr) minmax(260px,.92fr); }
      .tool-panel { position: absolute; z-index: 4; top: 0; left: 0; right: 0; width: 100%; height: 56px; max-height: none; flex-direction: row; align-items: center; gap: 6px; padding: 6px; overflow-x: auto; overflow-y: hidden; border-bottom: 1px solid #52634f; background: #142019ed; }
      .tool-panel .panel-title { display: none; }
      .tool-panel button { flex: 0 0 auto; width: auto; min-width: 92px; min-height: 44px; padding: 6px 10px; font-size: 12px; text-align: center; }
      .tool-panel button small { display: none; }
      .tool-panel select { flex: 0 0 126px; min-height: 44px; }
      .viewport-panel { grid-row: 1; }
      .viewport-info { top: 64px; left: 8px; }
      .viewport-hint { display: none; }
      .inspector { grid-row: 2; grid-template-columns: minmax(112px, 34%) minmax(0,1fr); grid-template-rows: minmax(0,1fr); }
      .hierarchy { border-right: 1px solid #35463a; border-bottom: 0; padding: 8px; }
      .node-row { min-height: 44px; padding: 6px; font-size: 11px; }
      .inspector-form { padding: 8px; gap: 6px; }
      .inspector-form label { grid-template-columns: 56px minmax(0,1fr); font-size: 12px; }
      .inspector-form input, .inspector-form button, .inspector-form select { min-height: 44px; font-size: 14px; }
      .xyz { gap: 4px; }
      .xyz label { grid-template-columns: 14px minmax(0,1fr); }
      .row-actions { gap: 6px; }
      .row-actions button { min-height: 44px; font-size: 11px; }
      .bottombar { padding: 2px 6px; gap: 6px; }
      .bottombar button { min-height: 44px; padding: 5px 8px; font-size: 11px; }
      #document-meta { display: none; }
      #editor-message { font-size: 10px; }
    }
    @media (max-width: 480px) {
      .brand { font-size: 13px; }
      .top-actions { gap: 3px; }
      .top-actions button, .top-actions a { min-height: 44px; padding: 4px 6px; font-size: 10px; }
      #connection-state { flex: 0 0 1px; width: 1px; max-width: 1px; overflow: hidden; font-size: 0; }
      .tool-panel button { min-width: 88px; }
      .inspector { grid-template-columns: minmax(104px, 32%) minmax(0,1fr); }
      .node-row { font-size: 10px; }
      .inspector-form label { grid-template-columns: 48px minmax(0,1fr); font-size: 11px; }
      .inspector-form input { font-size: 16px; }
      .xyz label { grid-template-columns: 12px minmax(0,1fr); }
      .bottombar { gap: 4px; }
      .bottombar button { min-width: 44px; padding: 4px 6px; font-size: 10px; }
    }
    @media (max-height: 540px) and (orientation: landscape) and (max-width: 900px) {
      #kutter-app { grid-template-rows: 48px minmax(0,1fr) 48px; }
      .workspace { grid-template-columns: minmax(0,1fr) minmax(240px,40%); grid-template-rows: minmax(0,1fr); }
      .viewport-panel { grid-column: 1; grid-row: 1; }
      .inspector { grid-column: 2; grid-row: 1; grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(88px,30%) minmax(0,1fr); }
      .hierarchy { border-right: 0; border-bottom: 1px solid #35463a; }
      .tool-panel { top: 4px; left: 4px; right: auto; width: min(42%, 340px); height: 48px; }
      .tool-panel button { min-width: 76px; }
      .viewport-info { top: 58px; }
      .bottombar #editor-message { display: none; }
    }
  </style>
</head>
<body>
  <main id="kutter-app" aria-label="Kutter level editor">
    <header class="topbar">
      <div class="brand">KUTTER</div>
      <div class="subbrand">GATOGANSO LEVEL STUDIO · LIVE KOF DOCUMENT</div>
      <div class="top-actions">
        <span id="connection-state" role="status" aria-live="polite">Connecting…</span>
        <button id="open-file" type="button">Open</button>
        <button id="save-file" type="button">Save .kutter</button>
        <button id="fullscreen-button" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen">Fullscreen</button>
        <a href="/" aria-label="Return to GatoGanso">Game</a>
      </div>
    </header>
    <section class="workspace" aria-label="Editor workspace">
      <aside class="panel tool-panel" aria-label="Placement tools">
        <div class="panel-title">Place</div>
        <button type="button" data-tool="1" aria-pressed="true">Select<small>Pick and inspect nodes</small></button>
        <button type="button" data-tool="2" aria-pressed="false">Prop<small>Place greybox prop</small></button>
        <button type="button" data-tool="3" aria-pressed="false">Player spawn<small>Player start marker</small></button>
        <button type="button" data-tool="4" aria-pressed="false">Enemy spawn<small>Enemy start marker</small></button>
        <button type="button" data-tool="5" aria-pressed="false">Encounter<small>Encounter marker</small></button>
        <button type="button" data-tool="6" aria-pressed="false">Goal trigger<small>Required level goal</small></button>
        <button type="button" data-tool="7" aria-pressed="false">Light<small>Light marker</small></button>
        <button type="button" data-tool="8" aria-pressed="false">Erase<small>Remove selected node</small></button>
        <label class="panel-title" for="grid-size">Grid</label>
        <select id="grid-size" aria-label="Kutter snap grid">
          <option value="25">Small · 25</option>
          <option value="100" selected>Medium · 100</option>
          <option value="250">Large · 250</option>
        </select>
      </aside>
      <section class="viewport-panel" aria-label="3D level viewport">
        <canvas id="kutter-viewport" aria-label="3D Kutter viewport. Click to place or select on the grid." tabindex="0"></canvas>
        <div class="viewport-info" id="viewport-info">WAITING FOR KOF</div>
        <div class="viewport-hint">Click viewport to place/select · Use hierarchy for exact selection</div>
      </section>
      <aside class="panel inspector" aria-label="Level hierarchy and inspector">
        <section class="hierarchy">
          <div class="panel-title">Hierarchy · <span id="node-count">0</span></div>
          <div id="node-list" role="listbox" aria-label="Level nodes"></div>
          <div class="row-actions">
            <button id="group-nodes" type="button">Group selected</button>
            <button id="ungroup-node" type="button">Ungroup</button>
          </div>
        </section>
        <form class="inspector-form" id="inspector-form">
          <div class="panel-title">Inspector</div>
          <div id="selection-name">No node selected</div>
          <div class="xyz" aria-label="Position">
            <label>X<input id="node-x" type="number" step="25" aria-label="Node X position"></label>
            <label>Y<input id="node-y" type="number" step="25" aria-label="Node Y position"></label>
            <label>Z<input id="node-z" type="number" step="25" aria-label="Node Z position"></label>
          </div>
          <label>Rotation<input id="node-rotation" type="number" step="15000" aria-label="Node rotation in Kutter units"></label>
          <div class="xyz" aria-label="Node size">
            <label>Scale X<input id="node-sx" type="number" min="100" max="1000000" step="100" aria-label="Node X scale"></label>
            <label>Scale Y<input id="node-sy" type="number" min="100" max="1000000" step="100" aria-label="Node Y scale"></label>
            <label>Scale Z<input id="node-sz" type="number" min="100" max="1000000" step="100" aria-label="Node Z scale"></label>
          </div>
          <label>Color<input id="node-color" type="color" aria-label="Node color"></label>
          <label>Asset token<input id="asset-token" type="number" min="0" max="1000000" step="1" aria-label="Node asset token"></label>
          <div class="row-actions">
            <button id="duplicate-node" type="button">Duplicate</button>
            <button id="delete-node" type="button">Delete</button>
            <button id="move-node" type="button">Move to cursor</button>
            <button id="reset-transform" type="button">Reset transform</button>
          </div>
          <div id="validation" role="status" aria-live="polite">Checking level…</div>
        </form>
      </aside>
    </section>
    <footer class="bottombar">
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="refresh" type="button">Refresh</button>
      <span id="editor-message" role="status" aria-live="polite">Opening Kof editor session…</span>
      <span id="document-meta"></span>
    </footer>
    <input id="file-input" type="file" accept=".kutter,application/octet-stream">
  </main>
  <span id="fullscreen-status" class="sr-only" role="status" aria-live="polite"></span>
  <script src="kookie-webgl-renderer.js"></script>
  <script src="kutter-editor.js"></script>
</body>
</html>
