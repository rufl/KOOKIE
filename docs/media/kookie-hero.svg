<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">KOOKIE — an authoritative shooter engine built around Kof</title>
  <desc id="desc">A restrained dark technical banner. A circuit-like K mark sits beside the KOOKIE wordmark, the line Doors have prerequisites. Multiplayer has paperwork, and a flow from input through 60 hertz authority to snapshots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.62" stop-color="#111c33"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="1" opacity="0.34"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <path d="M0 336 C220 292 420 374 644 322 S1000 270 1200 310 V420 H0Z" fill="#0b1222" opacity="0.72"/>
  <path d="M746 54 H1142" stroke="#334155" stroke-width="1"/>
  <path d="M746 366 H1142" stroke="#334155" stroke-width="1"/>

  <g transform="translate(68 83)">
    <rect x="0" y="0" width="132" height="132" rx="28" fill="#0b1222" stroke="#475569" stroke-width="2"/>
    <circle cx="66" cy="66" r="44" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.9"/>
    <path d="M48 38 V94 M49 67 L80 38 M49 67 L84 97" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="square" stroke-linejoin="round"/>
    <circle cx="66" cy="22" r="5" fill="#38bdf8"/>
    <circle cx="105" cy="51" r="5" fill="#f59e0b"/>
    <circle cx="92" cy="105" r="5" fill="#ef4444"/>
    <circle cx="27" cy="91" r="5" fill="#38bdf8"/>
    <path d="M66 27 V38 M100 53 L84 59 M88 101 L78 91 M31 88 L45 79" stroke="#64748b" stroke-width="2"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="230" y="138" fill="#f8fafc" font-size="76" font-weight="750" letter-spacing="12">KOOKIE</text>
    <text x="234" y="178" fill="#38bdf8" font-size="18" font-weight="650" letter-spacing="2.4">AUTHORITATIVE SHOOTER ENGINE · KOF + SDL3</text>
    <text x="234" y="223" fill="#cbd5e1" font-size="19">Doors have prerequisites. Multiplayer has paperwork.</text>
  </g>

  <g transform="translate(68 279)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="640" height="72" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="27" fill="#94a3b8" font-size="12" letter-spacing="1.4">CURRENT BOUNDED PATH</text>
    <text x="24" y="51" fill="#f8fafc" font-size="15">INPUT</text>
    <path d="M92 46 H143" stroke="url(#signal)" stroke-width="3"/>
    <path d="m143 46 -8 -5 v10z" fill="#38bdf8"/>
    <text x="161" y="51" fill="#22c55e" font-size="15">60 HZ AUTHORITY</text>
    <path d="M314 46 H365" stroke="url(#signal)" stroke-width="3"/>
    <path d="m365 46 -8 -5 v10z" fill="#38bdf8"/>
    <text x="383" y="51" fill="#f8fafc" font-size="15">SNAPSHOT</text>
    <path d="M470 46 H521" stroke="url(#signal)" stroke-width="3"/>
    <path d="m521 46 -8 -5 v10z" fill="#38bdf8"/>
    <text x="539" y="51" fill="#f59e0b" font-size="15">RECONCILE</text>
  </g>

  <g transform="translate(768 104)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="374" height="204" rx="18" fill="#0b1222" stroke="#334155"/>
    <text x="24" y="34" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.4">EVIDENCE, NOT ADJECTIVES</text>
    <g transform="translate(24 61)">
      <circle cx="6" cy="6" r="6" fill="#22c55e" filter="url(#glow)"/>
      <text x="24" y="12" fill="#f8fafc" font-size="17" font-weight="650">60 Hz authoritative loop</text>
      <text x="24" y="34" fill="#94a3b8" font-size="13">two admitted clients + replay</text>
    </g>
    <g transform="translate(24 119)">
      <circle cx="6" cy="6" r="6" fill="#38bdf8"/>
      <text x="24" y="12" fill="#f8fafc" font-size="17" font-weight="650">984 GPU instances · one draw</text>
      <text x="24" y="34" fill="#94a3b8" font-size="13">bounded Linux x86-64 reference run</text>
    </g>
    <g transform="translate(24 177)">
      <circle cx="6" cy="6" r="6" fill="#f59e0b"/>
      <text x="24" y="12" fill="#f8fafc" font-size="15" font-weight="650">EXPERIMENTAL · DOGFOOD</text>
    </g>
  </g>

  <path d="M24 24 H116 V28 H28 V116 H24Z" fill="#22c55e"/>
  <path d="M1176 396 H1084 V392 H1172 V304 H1176Z" fill="#38bdf8"/>
</svg>
