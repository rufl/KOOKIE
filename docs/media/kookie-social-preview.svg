<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">KOOKIE social preview</title>
  <desc id="desc">KOOKIE wordmark with a circuit-like K, authoritative shooter engine description, dry-humour tagline, and bounded engine flow on a dark technical grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.56" stop-color="#111c33"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.75" cy="0.28" r="0.72">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="0.48" stop-color="#22c55e" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#334155" stroke-width="1" opacity="0.34"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <path d="M0 514 C230 450 408 568 665 500 S1037 420 1280 492 V640 H0Z" fill="#0b1222" opacity="0.78"/>

  <g transform="translate(78 80)">
    <rect width="154" height="154" rx="32" fill="#0b1222" stroke="#475569" stroke-width="2"/>
    <circle cx="77" cy="77" r="52" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.94"/>
    <path d="M56 44V111 M57 78L94 44 M57 78L98 114" fill="none" stroke="#f8fafc" stroke-width="11" stroke-linecap="square" stroke-linejoin="round"/>
    <circle cx="77" cy="25" r="6" fill="#38bdf8"/>
    <circle cx="124" cy="60" r="6" fill="#f59e0b"/>
    <circle cx="108" cy="123" r="6" fill="#ef4444"/>
    <circle cx="31" cy="106" r="6" fill="#38bdf8"/>
    <path d="M77 31V44 M118 63L98 70 M103 118L91 107 M36 102L53 92" stroke="#64748b" stroke-width="3"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="270" y="172" fill="#f8fafc" font-size="102" font-weight="760" letter-spacing="16">KOOKIE</text>
    <text x="276" y="219" fill="#38bdf8" font-size="22" font-weight="680" letter-spacing="2.8">AUTHORITATIVE SHOOTER ENGINE</text>
    <text x="79" y="304" fill="#e2e8f0" font-size="29" font-weight="520">Boomer-shooter speed. ARPG structure.</text>
    <text x="79" y="346" fill="#e2e8f0" font-size="29" font-weight="520">A small Kof core behind explicit native boundaries.</text>
    <text x="79" y="407" fill="#94a3b8" font-size="24">Doors have prerequisites. Multiplayer has paperwork.</text>
  </g>

  <g transform="translate(78 486)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="810" height="86" rx="16" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="31" fill="#94a3b8" font-size="13" letter-spacing="1.6">BOUNDED DATA FLOW</text>
    <text x="25" y="62" fill="#f8fafc" font-size="18">INPUT</text>
    <path d="M105 56H169" stroke="url(#signal)" stroke-width="4"/>
    <path d="m169 56-10-6v12z" fill="#38bdf8"/>
    <text x="192" y="62" fill="#22c55e" font-size="18">60 HZ AUTHORITY</text>
    <path d="M376 56H440" stroke="url(#signal)" stroke-width="4"/>
    <path d="m440 56-10-6v12z" fill="#38bdf8"/>
    <text x="463" y="62" fill="#f8fafc" font-size="18">SNAPSHOT</text>
    <path d="M567 56H631" stroke="url(#signal)" stroke-width="4"/>
    <path d="m631 56-10-6v12z" fill="#38bdf8"/>
    <text x="654" y="62" fill="#f59e0b" font-size="18">RECONCILE</text>
  </g>

  <g transform="translate(925 474)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="278" height="110" rx="16" fill="#0b1222" stroke="#334155"/>
    <circle cx="28" cy="31" r="7" fill="#22c55e" filter="url(#glow)"/>
    <text x="48" y="37" fill="#f8fafc" font-size="17" font-weight="650">KOF + SDL3</text>
    <circle cx="28" cy="74" r="7" fill="#38bdf8"/>
    <text x="48" y="80" fill="#f8fafc" font-size="17" font-weight="650">LINUX X86-64</text>
  </g>

  <text x="1202" y="84" text-anchor="end" fill="#f59e0b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">EXPERIMENTAL / DOGFOOD</text>
  <path d="M30 30H144V35H35V144H30Z" fill="#22c55e"/>
  <path d="M1250 610H1136V605H1245V496H1250Z" fill="#38bdf8"/>
</svg>
